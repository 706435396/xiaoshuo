name: IndexNow 定时增量推送

# 把最近更新的 URL 推送给 IndexNow（一次提交共享给 Bing / Yandex / Seznam 等引擎）。
#
# 增量策略（两道保险）：
#   1) --since-days 只取 sitemap 中 lastmod 在窗口内的 URL —— 老书不重复推；
#   2) .indexnow_state.json 记录已推 URL，通过 actions/cache 跨 run 持久化去重。
# IndexNow 本身幂等（重复提交同一 URL 无害），所以偶尔重复也不要紧。
#
# 依赖：sitemap 需保持更新（新书入库后先重建 sitemap，本 Action 才能推到新页）。
# 时区：cron 用 UTC，北京时间 = UTC+8。
#
# 手动触发可选三种模式：
#   incremental 增量（默认）｜ dry-run 只预览 ｜ full 清空状态全量重推

on:
  schedule:
    - cron: '10 1 * * *'   # 每天北京时间 09:10（UTC 01:10）
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'incremental'
        type: choice
        options:
          - incremental
          - dry-run
          - full
      since_days:
        description: '只推最近 N 天更新的 URL（incremental 有效）'
        required: false
        default: '3'
        type: string
      endpoints:
        description: '推送端点（逗号分隔：global,bing,yandex,...）'
        required: false
        default: 'global,bing'
        type: string

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 校验 key 与脚本
        run: |
          test -s indexnow-key.txt || { echo "::error::indexnow-key.txt 缺失"; exit 1; }
          test -s tools/indexnow_bulk.py || { echo "::error::tools/indexnow_bulk.py 缺失"; exit 1; }
          echo "OK: key + 脚本就绪"

      - name: 恢复推送状态（跨 run 去重）
        # full 模式跳过恢复，从零开始全量重推；定时触发默认执行
        if: ${{ github.event_name == 'schedule' || inputs.mode != 'full' }}
        uses: actions/cache@v4
        with:
          path: tools/.indexnow_state.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: |
            indexnow-state-

      - name: 组装运行参数
        id: args
        run: |
          MODE="${{ inputs.mode || 'incremental' }}"
          SINCE="${{ inputs.since_days || '3' }}"
          EPS="${{ inputs.endpoints || 'global,bing' }}"
          FLAGS=""
          case "$MODE" in
            full) FLAGS="--reset-state"; SINCE="0" ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "flags=$FLAGS --since-days $SINCE --endpoints $EPS" >> "$GITHUB_OUTPUT"

      - name: 预览（dry-run，不发送）
        if: ${{ inputs.mode == 'dry-run' }}
        env:
          FLAGS: ${{ steps.args.outputs.flags }}
        run: python tools/indexnow_bulk.py $FLAGS --workers 6 --dry-run

      - name: 推送到 IndexNow
        if: ${{ github.event_name == 'schedule' || inputs.mode != 'dry-run' }}
        env:
          FLAGS: ${{ steps.args.outputs.flags }}
        run: python tools/indexnow_bulk.py $FLAGS --workers 6 --delay 1

      - name: 写运行摘要
        if: always()
        env:
          MODE: ${{ steps.args.outputs.mode }}
          FLAGS: ${{ steps.args.outputs.flags }}
        run: |
          {
            echo "### IndexNow 增量推送"
            echo "- 模式: $MODE"
            echo "- 参数: \`$FLAGS\`"
            echo "- 时间: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 状态文件: tools/.indexnow_state.json（cache key 前缀 indexnow-state-）"
          } >> "$GITHUB_STEP_SUMMARY"
