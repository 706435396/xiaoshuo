name: SEO Auto Submit (IndexNow)

# 每天 UTC 03:00 与 12:00（北京时间 11:00 / 20:00）各跑一次
# 仅做技术性收录：生成站内推荐数据 + 推送 URL 给 Bing/Yandex（不向任何外部平台发布内容）
on:
  schedule:
    - cron: '0 3,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. 生成站内推荐数据与推送清单（含题材过滤）
        env:
          PROMO_NO_BODY_CACHE: '1'
        run: node tools/generate_promo.js

      - name: 2. 推送 URL 给 Bing / Yandex（IndexNow）
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node tools/indexnow_submit.js

      - name: 上传本次产出供查看
        uses: actions/upload-artifact@v4
        with:
          name: seo-submit-output
          path: promo/out.json
          retention-days: 7

      # 把当天推荐数据写回仓库，CF Pages 自动部署后首页即可读到（与 IndexNow 推送 URL 一致）
      # [skip ci] + 内容无变化才跳过，避免每日空提交与循环触发
      - name: 3. 回写推荐数据到仓库（供首页读取）
        run: |
          if git diff --quiet -- promo/out.json; then
            echo "out.json 无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promo/out.json
          git commit -m "chore: 更新今日推荐数据 [skip ci]" || echo "无需提交"
          git push || echo "推送失败（不影响本次收录提交）"
