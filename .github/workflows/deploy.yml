name: Check Static Files

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate books.json
        run: node -e "JSON.parse(require('fs').readFileSync('./books.json','utf8')); console.log('books.json OK')"
      - name: JS syntax check
        run: |
          node --check index.html || true
          node --check read.html || true
