name: Build Android APK (深夜文库)

# 在云端构建 APK，本机无需装 Android Studio / JDK / SDK。
# 触发后可到 Actions 页面下载 artifact，或直接点下面的直链。
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 注意：ubuntu-latest runner 已预装完整 Android SDK（含 platform 35 / build-tools），
      # 不要用 android-actions/setup-android@v3 —— 它在 Ubuntu 26.04 上执行
      # `sdkmanager tools` 会因该包已更名而失败（实测 2026-11-27）。
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" | head

      - name: Generate debug keystore
        working-directory: android-app/app
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK with version
        run: |
          mkdir -p apk-out
          cp android-app/app/build/outputs/apk/release/app-release.apk \
             "apk-out/shenye-reader-v1.4.apk"
          ls -lh apk-out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shenye-reader-apk
          path: apk-out/*.apk
          retention-days: 90
