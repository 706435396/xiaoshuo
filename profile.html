<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="juicyads-site-verification" content="a57a2d3763d0bc82cc042c5cd227057a" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<meta name="rating" content="adult" />
<title>个人资料 | 深夜文库</title>
<style>
  :root{--bg:#0d0d0d;--card:#161616;--fg:#e5e5e5;--muted:#9a9a9a;--orange:#ff9500;--line:#262626}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
  .wrap{max-width:560px;margin:0 auto;padding:32px 20px 60px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  .top a{color:var(--muted);text-decoration:none;font-size:14px}
  .top a:hover{color:var(--orange)}
  h1{font-size:22px;margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .k{color:var(--muted);font-size:14px}
  .v{font-size:14px;text-align:right}
  .avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#ff9500,#ff5f00);display:flex;align-items:center;justify-content:center;font-size:24px;color:#111;font-weight:600;margin-bottom:14px}
  .name{font-size:20px;font-weight:600}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;margin-left:10px;vertical-align:middle}
  .b-normal{background:#123c28;color:#5ad48a;border:1px solid #2c7a4b}
  .stats{display:flex;gap:8px}
  .stat{flex:1;background:#0a0a0a;border:1px solid var(--line);border-radius:10px;padding:14px 6px;text-align:center}
  .stat b{display:block;font-size:22px;color:var(--orange)}
  .stat span{font-size:12px;color:var(--muted)}
  .btn{display:block;width:100%;background:var(--orange);color:#111;border:0;border-radius:8px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;margin-top:12px}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.ghost:hover{color:#ff7a7a;border-color:#5a2020}
  .hint{color:var(--muted);font-size:13px;line-height:1.8}
  .msg{font-size:13px;min-height:18px;margin-top:10px;color:var(--muted)}
  .notlogin{text-align:center;padding:40px 10px}
  .notlogin p{color:var(--muted);margin:0 0 20px}
  a{color:var(--orange)}
</style>
  <script src="/analytics.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/">← 首页</a></div>

  <div id="guest" class="card notlogin" style="display:none">
    <p>你还没有登录</p>
    <a class="btn" href="/read.html">去登录</a>
  </div>

  <div id="panel">
    <div class="card">
      <div class="avatar" id="avatar">读</div>
      <div class="name"><span id="uname">—</span><span class="badge b-normal" id="vipBadge">免费读者</span></div>
      <div class="hint" style="margin-top:6px">本站全站免费，所有章节均可阅读。登录可同步收藏、评分与阅读进度。</div>
    </div>

    <div class="card">
      <div class="k" style="margin-bottom:8px">我的阅读</div>
      <div class="stats">
        <div class="stat"><b id="sFav">0</b><span>收藏</span></div>
        <div class="stat"><b id="sRate">0</b><span>评分</span></div>
        <div class="stat"><b id="sProg">0</b><span>在读</span></div>
      </div>
      <div class="hint" style="margin-top:14px">阅读收藏、评分与进度在登录后自动云同步，换设备也能接着读。</div>
    </div>

    <div class="card">
      <div class="k" style="margin-bottom:6px">账号信息</div>
      <div class="row"><span class="k">账号</span><span class="v" id="rowUser">—</span></div>
      <div class="row"><span class="k">阅读权限</span><span class="v">全站免费 · 无限制</span></div>
    </div>

    <div class="card">
      <button class="btn ghost" id="logoutBtn">退出登录</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const AUTH_KEY = 'ebook_token', USER_KEY = 'ebook_user';
  const getToken = () => { try { return localStorage.getItem(AUTH_KEY); } catch (e) { return null; } };
  const getCurUser = () => { try { return localStorage.getItem(USER_KEY); } catch (e) { return null; } };

  async function apiCall(path, opts = {}) {
    const token = getToken();
    const headers = Object.assign({ 'content-type': 'application/json' }, opts.headers || {});
    if (token) headers['authorization'] = 'Bearer ' + token;
    try {
      const res = await fetch('/api' + path, Object.assign({ method: opts.method || 'GET', headers }, opts.body ? { body: opts.body } : {}));
      let data = {}; try { data = await res.json(); } catch (e) {}
      return { ok: res.ok, status: res.status, data };
    } catch (e) { return { ok: false, status: 0, data: {} }; }
  }

  function statCount(prefix) {
    let n = 0;
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(prefix) === 0) n++; } } catch (e) {}
    return n;
  }

  async function init() {
    const user = getCurUser();
    if (!getToken() || !user) {
      $('guest').style.display = '';
      $('panel').style.display = 'none';
      return;
    }
    $('uname').textContent = user;
    $('rowUser').textContent = user;
    $('avatar').textContent = (user[0] || '读').toUpperCase();

    try {
      const favs = JSON.parse(localStorage.getItem('ebook_favs') || '[]');
      $('sFav').textContent = Array.isArray(favs) ? favs.length : 0;
    } catch (e) { $('sFav').textContent = 0; }
    $('sRate').textContent = statCount('ebook_rating_');
    $('sProg').textContent = statCount('ebook_progress_');

    // 全免费模式：不再查询会员状态，仅校验登录态是否有效
    const r = await apiCall('/me');
    if (r.status === 401) {
      doLogout(true);
      return;
    }
  }

  async function doLogout(silent) {
    try { await apiCall('/logout', { method: 'POST' }); } catch (e) {}
    localStorage.removeItem(AUTH_KEY);
    localStorage.removeItem(USER_KEY);
    if (!silent) location.href = '/';
    else { $('guest').style.display = ''; $('panel').style.display = 'none'; }
  }

  $('logoutBtn').addEventListener('click', async () => {
    $('logoutBtn').disabled = true;
    $('msg').textContent = '正在退出…';
    await doLogout(false);
  });

  init();
})();
</script>
</body>
</html>
