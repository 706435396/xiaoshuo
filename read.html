<!DOCTYPE html>
<html lang="zh-CN" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阅读器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%234b5563'/%3E%3Crect%20x='9'%20y='8'%20width='3'%20height='16'%20rx='1'%20fill='white'/%3E%3Crect%20x='14'%20y='8'%20width='9'%20height='16'%20rx='1'%20fill='white'%20opacity='.85'/%3E%3C/svg%3E" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <!-- epub.js 官方 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  <style>
    #viewer { width: 100%; height: 100%; }
    .reader-shadow { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .spinner { border: 3px solid rgba(120,120,120,.25); border-top-color: #6b7280; border-radius: 50%; width: 28px; height: 28px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-[#121212] dark:text-gray-200 h-screen flex flex-col">
  <!-- 顶部控制条 -->
  <header class="shrink-0 bg-white/80 dark:bg-[#1a1a1a]/80 backdrop-blur border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center gap-3">
      <button id="homeBtn" class="shrink-0 px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-[#2a2a2a] text-sm hover:bg-gray-200 dark:hover:bg-[#333] transition">← 首页</button>
      <span id="bookTitle" class="font-medium truncate flex-1">阅读器</span>
      <span id="progressText" class="hidden text-xs text-gray-500 dark:text-gray-400 shrink-0 mr-2"></span>
      <!-- 收藏 / 评分 / 备份（所有类型通用） -->
      <button id="favBtn" title="收藏" class="shrink-0 w-9 h-9 rounded-lg bg-gray-100 dark:bg-[#2a2a2a] flex items-center justify-center text-lg text-gray-400 dark:text-gray-500 hover:bg-gray-200 dark:hover:bg-[#333] transition">♥</button>
      <span id="rateStars" class="hidden sm:flex shrink-0 items-center gap-0.5 text-lg"></span>
      <button id="backupBtn" title="导出进度备份" class="shrink-0 px-2 py-1 rounded-lg bg-gray-100 dark:bg-[#2a2a2a] hover:bg-gray-200 dark:hover:bg-[#333] text-sm transition">⤓</button>
      <button id="restoreBtn" title="导入进度备份" class="shrink-0 px-2 py-1 rounded-lg bg-gray-100 dark:bg-[#2a2a2a] hover:bg-gray-200 dark:hover:bg-[#333] text-sm transition">⤒</button>
      <button id="authBtn" title="登录 / 注册" class="shrink-0 px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-[#2a2a2a] text-sm hover:bg-gray-200 dark:hover:bg-[#333] transition">登录</button>
      <input id="importFile" type="file" accept="application/json" class="hidden" />
      <!-- epub 控制面板 -->
      <div id="epubControls" class="hidden shrink-0 flex items-center gap-1 text-sm">
        <button id="prevBtn" title="上一页" class="px-2 py-1 rounded bg-gray-100 dark:bg-[#2a2a2a] hover:bg-gray-200 dark:hover:bg-[#333]">‹</button>
        <button id="fontDec" title="缩小字体" class="px-2 py-1 rounded bg-gray-100 dark:bg-[#2a2a2a] hover:bg-gray-200 dark:hover:bg-[#333]">A-</button>
        <button id="fontInc" title="放大字体" class="px-2 py-1 rounded bg-gray-100 dark:bg-[#2a2a2a] hover:bg-gray-200 dark:hover:bg-[#333]">A+</button>
        <button id="bgToggle" title="切换背景" class="px-2 py-1 rounded bg-gray-100 dark:bg-[#2a2a2a] hover:bg-gray-200 dark:hover:bg-[#333]">背景</button>
        <select id="tocSelect" title="目录" class="px-2 py-1 rounded bg-gray-100 dark:bg-[#2a2a2a] outline-none max-w-[140px]"></select>
        <button id="nextBtn" title="下一页" class="px-2 py-1 rounded bg-gray-100 dark:bg-[#2a2a2a] hover:bg-gray-200 dark:hover:bg-[#333]">›</button>
      </div>
    </div>
  </header>

  <!-- 登录 / 注册 模态框 -->
  <div id="authModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4">
    <div class="w-full max-w-sm card-shadow rounded-xl bg-white dark:bg-[#1a1a1a] p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 id="authTitle" class="text-base font-medium">登录</h3>
        <button id="authClose" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-lg leading-none">✕</button>
      </div>
      <div class="flex gap-2 mb-4 text-sm">
        <button id="tabLogin" class="auth-tab flex-1 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900">登录</button>
        <button id="tabReg" class="auth-tab flex-1 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300">注册</button>
      </div>
      <input id="authUser" type="text" placeholder="用户名（中英文/数字，1-32）" autocomplete="username"
        class="w-full px-3 py-2 mb-3 rounded-lg bg-gray-100 dark:bg-[#2a2a2a] border border-transparent focus:border-gray-300 dark:focus:border-gray-600 outline-none text-sm" />
      <input id="authPwd" type="password" placeholder="密码（至少6位）" autocomplete="current-password"
        class="w-full px-3 py-2 mb-3 rounded-lg bg-gray-100 dark:bg-[#2a2a2a] border border-transparent focus:border-gray-300 dark:focus:border-gray-600 outline-none text-sm" />
      <p id="authMsg" class="text-xs text-red-500 min-h-[1rem] mb-2"></p>
      <button id="authSubmit" class="w-full py-2 rounded-lg bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900 text-sm hover:opacity-90 transition">登录</button>
      <p class="text-xs text-gray-400 mt-3 text-center">登录后收藏 / 评分 / 阅读进度将云端同步，可跨设备。</p>
    </div>
  </div>

  <!-- 加载提示 -->
  <div id="loading" class="flex-1 flex flex-col items-center justify-center text-gray-400">
    <div class="spinner mb-3"></div><span class="text-sm">加载中…</span>
  </div>

  <!-- 错误提示 -->
  <div id="errorBox" class="hidden flex-1 flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-6 text-center">
    <div class="text-5xl mb-4">⚠️</div>
    <p id="errorMsg" class="text-sm"></p>
    <a href="index.html" class="mt-4 px-4 py-2 rounded-lg bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900 text-sm">返回首页</a>
  </div>

  <!-- epub 阅读器容器 -->
  <div id="viewerWrap" class="hidden flex-1 p-2 sm:p-4 overflow-hidden">
    <div id="viewer" class="mx-auto bg-white rounded-lg reader-shadow h-full" style="max-width:900px;"></div>
  </div>

  <!-- pdf 预览容器 -->
  <iframe id="pdfFrame" class="hidden flex-1 w-full border-0 bg-white"></iframe>

  <!-- txt 阅读容器 -->
  <div id="txtWrap" class="hidden flex-1 overflow-hidden bg-white dark:bg-[#121212]">
    <div id="txtContent" class="mx-auto max-w-[760px] h-full overflow-y-auto px-6 py-8" style="font-size:17px;line-height:1.9"></div>
  </div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  // ---------- 账号登录 + 进度云同步（Pages Functions + KV） ----------
  const AUTH_KEY = 'ebook_token', USER_KEY = 'ebook_user';
  function getToken() { try { return localStorage.getItem(AUTH_KEY); } catch (e) { return null; } }
  function getCurUser() { try { return localStorage.getItem(USER_KEY); } catch (e) { return null; } }
  async function apiCall(path, opts = {}) {
    const token = getToken();
    const headers = Object.assign({ 'content-type': 'application/json' }, opts.headers || {});
    if (token) headers['authorization'] = 'Bearer ' + token;
    try {
      const res = await fetch('/api' + path, Object.assign({ method: opts.method || 'GET', headers }, opts.body ? { body: opts.body } : {}));
      let data = {}; try { data = await res.json(); } catch (e) {}
      return { ok: res.ok, status: res.status, data };
    } catch (e) { return { ok: false, status: 0, data: { error: '网络错误' } }; }
  }
  function collectLocal() {
    const favs = [...getFavs()];
    const ratings = {}, progress = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i); if (!k) continue;
      if (k.indexOf('ebook_rating_') === 0) ratings[k.slice(13)] = parseInt(localStorage.getItem(k), 10) || 0;
      else if (k.indexOf('ebook_progress_') === 0) progress[k.slice(15)] = localStorage.getItem(k);
    }
    return { favs, ratings, progress };
  }
  async function syncPull() {
    const r = await apiCall('/progress');
    if (r.status === 401) { logout(); return; }
    if (!r.ok) return;
    const d = r.data || {};
    const cur = getFavs();
    (d.favs || []).forEach(id => cur.add(String(id)));
    try { localStorage.setItem('ebook_favs', JSON.stringify([...cur])); } catch (e) {}
    const ratings = d.ratings || {};
    for (const id in ratings) if (ratings[id]) localStorage.setItem('ebook_rating_' + id, String(ratings[id]));
    const progress = d.progress || {};
    for (const id in progress) if (progress[id]) localStorage.setItem('ebook_progress_' + id, progress[id]);
    if (typeof window.__afterSync === 'function') window.__afterSync();
  }
  let pushTimer = null;
  function syncPush() {
    if (!getToken()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(async () => {
      const r = await apiCall('/progress', { method: 'PUT', body: JSON.stringify(collectLocal()) });
      if (r.status === 401) logout();
    }, 800);
  }
  function onAuthed(token, user) {
    localStorage.setItem(AUTH_KEY, token);
    localStorage.setItem(USER_KEY, user);
    updateAuthUI(); syncPull();
  }
  function logout() { localStorage.removeItem(AUTH_KEY); localStorage.removeItem(USER_KEY); updateAuthUI(); }
  function updateAuthUI() {
    const b = $('authBtn'); if (!b) return;
    b.textContent = getCurUser() ? (getCurUser() + ' · 退出') : '登录';
  }
  let authMode = 'login';
  function switchAuthTab(mode) {
    authMode = mode;
    $('authTitle').textContent = mode === 'login' ? '登录' : '注册';
    $('authSubmit').textContent = mode === 'login' ? '登录' : '注册';
    const on = 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900';
    const off = 'bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300';
    $('tabLogin').className = 'auth-tab flex-1 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 ' + (mode === 'login' ? on : off);
    $('tabReg').className = 'auth-tab flex-1 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 ' + (mode === 'reg' ? on : off);
  }
  function openAuth(mode) { switchAuthTab(mode); $('authMsg').textContent = ''; $('authUser').value = ''; $('authPwd').value = ''; $('authModal').classList.remove('hidden'); setTimeout(() => $('authUser').focus(), 50); }
  function closeAuth() { $('authModal').classList.add('hidden'); }
  async function submitAuth() {
    const name = $('authUser').value.trim(), pwd = $('authPwd').value;
    if (!name || !pwd) { $('authMsg').textContent = '请输入用户名和密码'; return; }
    $('authSubmit').disabled = true;
    const r = await apiCall('/' + authMode, { method: 'POST', body: JSON.stringify({ username: name, password: pwd }) });
    $('authSubmit').disabled = false;
    if (r.ok) { closeAuth(); onAuthed(r.data.token, r.data.username); }
    else $('authMsg').textContent = r.data.error || '操作失败';
  }
  $('authBtn').addEventListener('click', () => { if (getCurUser()) logout(); else openAuth('login'); });
  $('authClose').addEventListener('click', closeAuth);
  $('authModal').addEventListener('click', (e) => { if (e.target === $('authModal')) closeAuth(); });
  $('tabLogin').addEventListener('click', () => switchAuthTab('login'));
  $('tabReg').addEventListener('click', () => switchAuthTab('reg'));
  $('authSubmit').addEventListener('click', submitAuth);
  $('authPwd').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAuth(); });
  $('authUser').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('authPwd').focus(); });

  // ---------- 收藏 / 评分（localStorage，无后端） ----------
  function getFavs() {
    try { return new Set(JSON.parse(localStorage.getItem('ebook_favs') || '[]')); } catch (e) { return new Set(); }
  }
  function isFav(id) { return getFavs().has(String(id)); }
  function toggleFav(id) {
    const s = getFavs(); const k = String(id);
    if (s.has(k)) s.delete(k); else s.add(k);
    try { localStorage.setItem('ebook_favs', JSON.stringify([...s])); } catch (e) {}
  }
  function getRating(id) {
    try { return parseInt(localStorage.getItem('ebook_rating_' + id) || '0', 10) || 0; } catch (e) { return 0; }
  }
  function setRating(id, v) {
    try {
      if (v <= 0) localStorage.removeItem('ebook_rating_' + id);
      else localStorage.setItem('ebook_rating_' + id, String(v));
    } catch (e) {}
  }

  // ---------- 进度备份导出 / 导入 ----------
  function exportBackup() {
    const data = { favs: [...getFavs()], ratings: {}, progress: {} };
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith('ebook_progress_')) data.progress[k] = localStorage.getItem(k);
      if (k.startsWith('ebook_rating_')) data.ratings[k] = localStorage.getItem(k);
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ebook-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }
  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (Array.isArray(d.favs)) localStorage.setItem('ebook_favs', JSON.stringify(d.favs));
        Object.entries(d.ratings || {}).forEach(([k, v]) => localStorage.setItem(k, v));
        Object.entries(d.progress || {}).forEach(([k, v]) => localStorage.setItem(k, v));
        alert('已恢复备份，即将刷新页面生效。');
        location.reload();
      } catch (e) { alert('备份文件解析失败，请确认是本站导出的 JSON。'); }
    };
    reader.readAsText(file);
  }

  $('homeBtn').onclick = () => { location.href = 'index.html'; };
  updateAuthUI(); // 刷新登录态显示（阅读页不自动拉取，避免覆盖当前阅读位置；首页负责拉取）

  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  function showError(msg) {
    $('loading').classList.add('hidden');
    $('viewerWrap').classList.add('hidden');
    $('pdfFrame').classList.add('hidden');
    $('errorBox').classList.remove('hidden');
    $('errorBox').classList.add('flex');
    $('errorMsg').textContent = msg;
  }

  if (!id) {
    showError('缺少书籍 id 参数，请从首页点击书籍进入。');
    return;
  }

  fetch('books.json').then(r => r.json()).then(books => {
    const book = (Array.isArray(books) ? books : []).find(b => String(b.id) === String(id));
    if (!book) { showError('未找到该书籍（id 不存在或 books.json 未包含）。'); return; }

    $('bookTitle').textContent = book.title || '阅读器';
    document.title = (book.title || '阅读器') + ' · 阅读器';

    // 收藏 / 评分 / 进度备份控件（epub 与 pdf 通用）
    function refreshFav() {
      const f = isFav(id);
      $('favBtn').className = 'shrink-0 w-9 h-9 rounded-lg flex items-center justify-center text-lg transition ' +
        (f ? 'bg-rose-500 text-white' : 'bg-gray-100 dark:bg-[#2a2a2a] text-gray-400 dark:text-gray-500 hover:bg-gray-200 dark:hover:bg-[#333]');
    }
    function renderRateStars() {
      const cur = getRating(id);
      $('rateStars').innerHTML = [1,2,3,4,5].map(v =>
        '<span class="rate-star cursor-pointer ' + (v <= cur ? 'text-amber-400' : 'text-gray-300 dark:text-gray-600') + '" data-val="' + v + '">★</span>'
      ).join('');
    }
    $('favBtn').onclick = () => { toggleFav(id); refreshFav(); syncPush(); };
    $('rateStars').onclick = (e) => {
      const s = e.target.closest('.rate-star'); if (!s) return;
      const v = +s.dataset.val; setRating(id, getRating(id) === v ? 0 : v); renderRateStars(); syncPush();
    };
    window.__afterSync = () => { refreshFav(); renderRateStars(); }; // 云端拉取后刷新本页收藏/星级
    $('backupBtn').onclick = exportBackup;
    $('restoreBtn').onclick = () => $('importFile').click();
    $('importFile').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ''; });
    refreshFav(); renderRateStars();

    // ---------- TXT 阅读器 ----------
    function initTxtReader(book) {
      const wrap = $('txtContent');
      const bgModes = [
        { name: '默认', bg: '#ffffff', fg: '#222222' },
        { name: '羊皮纸', bg: '#f8f1e3', fg: '#5b4a3a' },
        { name: '护眼绿', bg: '#c7edcc', fg: '#234d2b' },
        { name: '夜间', bg: '#1a1a1a', fg: '#cfcfcf' }
      ];
      let bgIndex = 0, fontSize = 17;
      const progressKey = 'ebook_progress_' + id;
      let savedPct = parseFloat(localStorage.getItem(progressKey) || '0') || 0;

      function applyTheme() {
        const m = bgModes[bgIndex];
        wrap.style.background = m.bg;
        wrap.style.color = m.fg;
        $('txtWrap').style.background = m.bg;
      }
      function applyFont() { wrap.style.fontSize = fontSize + 'px'; }

      // 解码：优先 UTF-8（强制），失败回退 GBK（中文 txt 常见编码）
      function decode(buf) {
        try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
        catch (e) { return new TextDecoder('gbk').decode(buf); }
      }

      // 章节切分：匹配「第X章/卷/回…」「Chapter N」「序章/楔子/番外」等
      const CHAPTER_RE = /^\s*(第\s*[0-9零一二三四五六七八九十百千万两]+\s*[章卷回部篇节集]|[Cc]hapter\s+\d+|序章|序言|前言|引言|后记|尾声|楔子|番外)\b/;
      function splitChapters(text) {
        const lines = text.split(/\r?\n/);
        const chapters = [];
        let cur = null;
        for (const line of lines) {
          if (CHAPTER_RE.test(line)) {
            if (cur) chapters.push(cur);
            cur = { title: (line.trim().slice(0, 40)) || ('第' + (chapters.length + 1) + '节'), paras: [] };
          } else {
            if (!cur) cur = { title: '正文', paras: [] };
            if (line.trim()) cur.paras.push(line.trim());
          }
        }
        if (cur) chapters.push(cur);
        if (!chapters.length) chapters.push({ title: '全文', paras: lines.filter(l => l.trim()) });
        return chapters;
      }

      function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

      function render(text) {
        const chapters = splitChapters(text);
        const html = chapters.map((c, i) =>
          '<section id="chap-' + i + '" data-chapter="' + i + '">' +
          '<h2 style="font-size:1.2em;font-weight:600;margin:.9em 0 .5em;border-bottom:1px solid rgba(128,128,128,.2);padding-bottom:.3em">' + esc(c.title) + '</h2>' +
          c.paras.map(p => '<p style="margin:0 0 1em;text-indent:2em;line-height:1.9">' + esc(p) + '</p>').join('') +
          '</section>'
        ).join('');
        wrap.innerHTML = html;
        const sel = $('tocSelect');
        sel.innerHTML = '<option value="">目录</option>' + chapters.map((c, i) => '<option value="' + i + '">' + esc(c.title.slice(0, 30)) + '</option>').join('');
        sel.onchange = () => { const i = +sel.value; if (i >= 0) { const el = $('chap-' + i); if (el) el.scrollIntoView({ behavior: 'smooth' }); } };
        applyTheme(); applyFont();
        requestAnimationFrame(() => {
          const max = wrap.scrollHeight - wrap.clientHeight;
          if (max > 0 && savedPct > 0) wrap.scrollTop = Math.round(savedPct * max);
          updateTxtProgress();
        });
      }

      function updateTxtProgress() {
        const max = wrap.scrollHeight - wrap.clientHeight;
        const pct = max > 0 ? wrap.scrollTop / max : 0;
        const el = $('progressText');
        el.classList.remove('hidden');
        el.textContent = '已读 ' + Math.round(pct * 100) + '%';
      }

      let savedTimer = null;
      function saveTxtProgress() {
        const max = wrap.scrollHeight - wrap.clientHeight;
        const pct = max > 0 ? wrap.scrollTop / max : 0;
        try { localStorage.setItem(progressKey, pct.toFixed(4)); } catch (e) {}
        syncPush();
      }
      wrap.addEventListener('scroll', () => {
        updateTxtProgress();
        clearTimeout(savedTimer);
        savedTimer = setTimeout(saveTxtProgress, 400);
      }, { passive: true });

      // 控件复用：翻页=整屏滚动，字体 +-，背景切换
      $('prevBtn').onclick = () => wrap.scrollBy({ top: -wrap.clientHeight * 0.9, behavior: 'smooth' });
      $('nextBtn').onclick = () => wrap.scrollBy({ top: wrap.clientHeight * 0.9, behavior: 'smooth' });
      $('fontDec').onclick = () => { fontSize = Math.max(13, fontSize - 1); applyFont(); };
      $('fontInc').onclick = () => { fontSize = Math.min(30, fontSize + 1); applyFont(); };
      $('bgToggle').textContent = bgModes[0].name;
      $('bgToggle').onclick = () => { bgIndex = (bgIndex + 1) % bgModes.length; applyTheme(); };

      fetch(book.url).then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.arrayBuffer();
      }).then(buf => render(decode(buf))).catch(err => {
        showError('TXT 加载失败：' + err.message + '（请确认链接有效且 R2 已开启 CORS）');
      });
    }

    // PDF：使用浏览器内置预览打开链接
    if (book.type === 'pdf') {
      $('loading').classList.add('hidden');
      $('pdfFrame').classList.remove('hidden');
      $('pdfFrame').src = book.url;
      return;
    }

    // TXT 阅读器：纯文本直接渲染，自动切分章节，复用主题 / 字体 / 进度
    if (book.type === 'txt' || /\.txt$/i.test(book.url || '')) {
      $('loading').classList.add('hidden');
      $('txtWrap').classList.remove('hidden');
      $('epubControls').classList.remove('hidden');
      initTxtReader(book);
      return;
    }

    // 仅支持 epub / pdf / txt
    if (book.type !== 'epub') { showError('不支持的书籍类型：' + (book.type || '未知')); return; }

    // EPUB 阅读器
    $('loading').classList.add('hidden');
    $('viewerWrap').classList.remove('hidden');
    $('epubControls').classList.remove('hidden');

    let bookObj, rendition;
    let fontSize = 100;
    // 阅读器配色：默认 / 羊皮纸 / 护眼绿 / 夜间
    const bgModes = [
      { name: '默认', bg: '#ffffff', fg: '#222222' },
      { name: '羊皮纸', bg: '#f8f1e3', fg: '#5b4a3a' },
      { name: '护眼绿', bg: '#c7edcc', fg: '#234d2b' },
      { name: '夜间', bg: '#1a1a1a', fg: '#cfcfcf' }
    ];
    let bgIndex = 0;

    // 阅读进度：key 按书籍 id 区分，保存 epub 分页位置（CFI）
    const progressKey = 'ebook_progress_' + id;
    let savedCfi = null;
    try { savedCfi = localStorage.getItem(progressKey); } catch (e) {}

    try {
      bookObj = ePub(book.url);
    } catch (e) {
      showError('epub.js 初始化失败：' + e.message);
      return;
    }

    rendition = bookObj.renderTo('viewer', { width: '100%', height: '100%', spread: 'auto' });

    // 恢复上次阅读位置（有进度则跳到该 CFI，否则从首页开始）
    const startDisplay = savedCfi ? rendition.display(savedCfi) : rendition.display();
    startDisplay.catch(() => {
      showError('电子书加载失败：链接失效或资源未开启跨域（CORS）访问，请检查 books.json 中的 url 与存储桶 CORS 设置。');
    });

    // 每次翻页保存位置
    rendition.on('relocated', (loc) => {
      try { localStorage.setItem(progressKey, loc.start.cfi); } catch (e) {}
      updateProgress(loc);
      syncPush(); // 已登录则防抖上传进度
    });

    // 生成定位点，用于计算阅读百分比
    bookObj.ready.then(() => bookObj.locations.generate(1000)).catch(() => {});

    function updateProgress(loc) {
      try {
        if (bookObj.locations && bookObj.locations.length()) {
          const pct = bookObj.locations.percentageFromCfi(loc.start.cfi);
          if (typeof pct === 'number' && !isNaN(pct)) {
            const el = $('progressText');
            el.classList.remove('hidden');
            el.textContent = '已读 ' + Math.round(pct * 100) + '%';
          }
        }
      } catch (e) {}
    }

    // 目录跳转
    bookObj.loaded.navigation.then(nav => {
      const sel = $('tocSelect');
      sel.innerHTML = '<option value="">目录</option>' + nav.toc.map((item, i) => '<option value="' + i + '">' + item.label + '</option>').join('');
      sel.onchange = () => { const i = +sel.value; if (nav.toc[i]) rendition.display(nav.toc[i].href); };
    }).catch(() => {});

    $('prevBtn').onclick = () => rendition.prev();
    $('nextBtn').onclick = () => rendition.next();
    $('fontDec').onclick = () => { fontSize = Math.max(80, fontSize - 10); rendition.themes.fontSize(fontSize + '%'); };
    $('fontInc').onclick = () => { fontSize = Math.min(200, fontSize + 10); rendition.themes.fontSize(fontSize + '%'); };
    $('bgToggle').textContent = bgModes[0].name;
    $('bgToggle').onclick = () => {
      bgIndex = (bgIndex + 1) % bgModes.length;
      const m = bgModes[bgIndex];
      rendition.themes.override('background', m.bg);
      rendition.themes.override('color', m.fg);
      $('bgToggle').textContent = m.name;
    };

    window.addEventListener('resize', () => rendition.resize());
  }).catch(err => {
    showError('books.json 加载失败，请通过本地服务器预览（见 README）。');
  });
})();
</script>
</body>
</html>
