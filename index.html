<script>
(function () {
  const PER_PAGE = 12;
  // R2 公共域名前缀（首页已改为纯文字列表，不再使用封面；read.html 仍会用到）
  const R2_BASE = 'https://pub-0286f9f1305243479f676d853bc3c827.r2.dev/';
  const resolveUrl = (v) => (v ? R2_BASE + v : '');
  let books = [];
  let filtered = [];
  let activeCategory = '全部';
  let searchTerm = '';
  let currentPage = 1;
  let sortMode = 'latest';
  let currentRandom = [];
  let randomCat = '全部';
  let excludeRead = false;
  let ratingFirst = false;
  let favFirst = false;
  let unratedOnly = false;
  let allCategories = [];

  const $ = (id) => document.getElementById(id);

  // 随机推荐区块已移除（2026-11-22）：补建隐藏的同名空节点，
  // 让原有随机推荐 JS 逻辑继续安全运行（不报错、不显示），避免大规模删改。
  (function () {
    var ids = ['randomSection','randomCat','randomGrid','excludeReadBtn','ratingFirstBtn','favFirstBtn','unratedBtn','shuffleBtn'];
    ids.forEach(function (id) {
      if (document.getElementById(id)) return;
      var el = document.createElement(id === 'randomCat' ? 'select' : 'div');
      el.id = id;
      el.style.display = 'none';
      document.body.appendChild(el);
    });
  })();

  // ---------- 账号登录 + 进度云同步（Pages Functions + KV，无独立后端） ----------
  const AUTH_KEY = 'ebook_token', USER_KEY = 'ebook_user';
  function getToken() { try { return localStorage.getItem(AUTH_KEY); } catch (e) { return null; } }
  function getCurUser() { try { return localStorage.getItem(USER_KEY); } catch (e) { return null; } }
  async function apiCall(path, opts = {}) {
    const token = getToken();
    const headers = Object.assign({ 'content-type': 'application/json' }, opts.headers || {});
    if (token) headers['authorization'] = 'Bearer ' + token;
    try {
      const res = await fetch('/api' + path, Object.assign({ method: opts.method || 'GET', headers }, opts.body ? { body: opts.body } : {}));
      let data = {}; try { data = await res.json(); } catch (e) {}
      return { ok: res.ok, status: res.status, data };
    } catch (e) { return { ok: false, status: 0, data: { error: '网络错误' } }; }
  }
  function collectLocal() {
    const favs = [...getFavs()];
    const ratings = {}, progress = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i); if (!k) continue;
      if (k.indexOf('ebook_rating_') === 0) ratings[k.slice(13)] = parseInt(localStorage.getItem(k), 10) || 0;
      else if (k.indexOf('ebook_progress_') === 0) progress[k.slice(15)] = localStorage.getItem(k);
    }
    return { favs, ratings, progress };
  }
  async function syncPull() {
    const r = await apiCall('/progress');
    if (r.status === 401) { logout(); return; }
    if (!r.ok) return;
    const d = r.data || {};
    const cur = getFavs();
    (d.favs || []).forEach(id => cur.add(String(id)));
    try { localStorage.setItem('ebook_favs', JSON.stringify([...cur])); } catch (e) {}
    const ratings = d.ratings || {};
    for (const id in ratings) if (ratings[id]) localStorage.setItem('ebook_rating_' + id, String(ratings[id]));
    const progress = d.progress || {};
    for (const id in progress) if (progress[id]) localStorage.setItem('ebook_progress_' + id, progress[id]);
    if (books.length) { rerender(); renderShelf(); }
  }
  let pushTimer = null;
  function syncPush() {
    if (!getToken()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(async () => {
      const r = await apiCall('/progress', { method: 'PUT', body: JSON.stringify(collectLocal()) });
      if (r.status === 401) logout();
    }, 800);
  }
  function onAuthed(token, user) {
    localStorage.setItem(AUTH_KEY, token);
    localStorage.setItem(USER_KEY, user);
    updateAuthUI();
    syncPull().then(syncPush);
  }
  async function logout() {
    try { await apiCall('/logout', { method: 'POST' }); } catch (e) {}
    localStorage.removeItem(AUTH_KEY); localStorage.removeItem(USER_KEY);
    updateAuthUI();
  }
  function updateAuthUI() {
    const b = $('authBtn'); if (!b) return;
    const u = getCurUser();
    const lab = $('authLabel'); if (lab) lab.textContent = u ? (u + ' ▾') : '登录';
  }
  let authMode = 'login';
  function switchAuthTab(mode) {
    authMode = mode;
    $('authTitle').textContent = mode === 'login' ? '登录' : '注册';
    $('authSubmit').textContent = mode === 'login' ? '登录' : '注册';
    const on = 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900';
    const off = 'bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300';
    $('tabLogin').className = 'auth-tab flex-1 py-1.5 rounded-lg border border-gray-200 dark:border-[#333] ' + (mode === 'login' ? on : off);
    $('tabReg').className = 'auth-tab flex-1 py-1.5 rounded-lg border border-gray-200 dark:border-[#333] ' + (mode === 'reg' ? on : off);
  }
  function openAuth(mode) { switchAuthTab(mode); $('authMsg').textContent = ''; $('authUser').value = ''; $('authPwd').value = ''; $('authModal').classList.remove('hidden'); setTimeout(() => $('authUser').focus(), 50); }
  function closeAuth() { $('authModal').classList.add('hidden'); }
  async function submitAuth() {
    const name = $('authUser').value.trim(), pwd = $('authPwd').value;
    if (!name || !pwd) { $('authMsg').textContent = '请输入用户名和密码'; return; }
    $('authSubmit').disabled = true;
    const endpoint = authMode === 'reg' ? '/register' : '/login';
    const r = await apiCall(endpoint, { method: 'POST', body: JSON.stringify({ username: name, password: pwd }) });
    $('authSubmit').disabled = false;
    if (r.ok) {
      closeAuth(); onAuthed(r.data.token, r.data.username);
      try { if (authMode === 'reg' && window.SY_TRACK) SY_TRACK.signUp('site_form'); else if (window.SY_TRACK) SY_TRACK.login(); } catch (e) {}
    }
    else $('authMsg').textContent = r.data.error || '操作失败';
  }
  $('authBtn').addEventListener('click', () => { if (getCurUser()) location.href = '/profile'; else openAuth('login'); });
  $('authClose').addEventListener('click', closeAuth);
  $('authModal').addEventListener('click', (e) => { if (e.target === $('authModal')) closeAuth(); });
  $('tabLogin').addEventListener('click', () => switchAuthTab('login'));
  $('tabReg').addEventListener('click', () => switchAuthTab('reg'));
  $('authSubmit').addEventListener('click', submitAuth);
  $('authPwd').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAuth(); });
  $('authUser').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('authPwd').focus(); });

  // ---------- 收藏 / 评分（localStorage，无后端） ----------
  function getFavs() {
    try { return new Set(JSON.parse(localStorage.getItem('ebook_favs') || '[]')); } catch (e) { return new Set(); }
  }
  function isFav(id) { return getFavs().has(String(id)); }
  function toggleFav(id) {
    const s = getFavs(); const k = String(id);
    if (s.has(k)) s.delete(k); else s.add(k);
    try { localStorage.setItem('ebook_favs', JSON.stringify([...s])); } catch (e) {}
  }
  function getRating(id) {
    try { return parseInt(localStorage.getItem('ebook_rating_' + id) || '0', 10) || 0; } catch (e) { return 0; }
  }
  function setRating(id, v) {
    try {
      if (v <= 0) localStorage.removeItem('ebook_rating_' + id);
      else localStorage.setItem('ebook_rating_' + id, String(v));
    } catch (e) {}
  }

  // ---------- 暗黑模式切换 ----------
  function updateThemeIcon() {
    $('themeIcon').textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
  }
  $('themeToggle').addEventListener('click', function () {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updateThemeIcon();
  });
  updateThemeIcon();

  // 类型角标：根据书籍 type 返回彩色标签（txt / epub / pdf）
  const TYPE_BADGE = {
    txt:  { label: 'TXT',  cls: 'bg-sky-600' },
    epub: { label: 'EPUB', cls: 'bg-purple-600' },
    pdf:  { label: 'PDF',  cls: 'bg-rose-600' },
  };

  // 稳定的伪随机「阅读量 / 上架日期」（纯展示用假数据，按 id 派生，刷新不变）
  function fakeViews(id) {
    let x = (id * 2654435761) >>> 0;
    x = (x ^ (x >>> 13)) >>> 0;
    const n = 120 + (x % 9880);
    return n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(n);
  }
  function fakeDate(id) {
    let x = (id * 40503 + 12345) >>> 0;
    const daysAgo = x % 120;
    const d = new Date(2026, 10, 15); // 基准日 = 今天
    d.setDate(d.getDate() - daysAgo);
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  // 单张卡片 HTML（紧凑文字行，无封面；首页与随机推荐共用；贴合截图：作者+日期+阅读量）
  // SEO：外层用 <div> 而非 <a>，避免嵌套 <a>；标题链到 read.html 阅读，另有独立「详情」链到 book/{id}（真实可爬内链）
  function cardHtml(b) {
    const fav = isFav(b.id);
    const rating = getRating(b.id);
    const stars = [1,2,3,4,5].map(v =>
      '<span class="star cursor-pointer ' + (v <= rating ? 'text-amber-400' : 'text-gray-400 dark:text-gray-600') + '" data-id="' + b.id + '" data-val="' + v + '">★</span>'
    ).join('');
    const t = ((b.type || '').toLowerCase());
    const info = TYPE_BADGE[t] || { label: (b.type || '?').toUpperCase(), cls: 'bg-gray-600' };
    const vipBadge = '<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold text-white bg-emerald-500">免费</span>';
    const readHref = 'read.html?id=' + b.id + '&u=' + encodeURIComponent(b.url || '') + '&t=' + encodeURIComponent(b.title || '') + (b.free ? '&free=1' : '');
    return '<div class="card relative block rounded-lg bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-[#2a2a2a] hover:border-[#ff9500]/70 dark:hover:border-[#ff9500]/70 transition px-3 py-2.5 group cursor-pointer" data-read="' + readHref.replace(/"/g, '&quot;') + '">' +
      '<div class="flex items-start justify-between gap-2">' +
        '<h3 class="font-medium text-[14px] leading-snug text-gray-800 dark:text-gray-100 truncate min-w-0"><a href="' + readHref + '" class="hover:text-[#ff9500] dark:hover:text-[#ffb84d]">' + b.title + '</a></h3>' +
        '<div class="flex items-center gap-1.5 shrink-0">' +
          '<button class="fav-btn w-6 h-6 rounded-full flex items-center justify-center text-xs ' + (fav ? 'bg-rose-500 text-white' : 'bg-gray-100 dark:bg-[#2a2a2a] text-gray-400 hover:text-rose-400') + '" data-id="' + b.id + '" title="收藏">♥</button>' +
          vipBadge +
          '<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold text-white ' + info.cls + '">' + info.label + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="mt-1.5 flex items-center gap-2.5 text-[11px] text-gray-500 dark:text-gray-400">' +
        '<span class="flex items-center gap-1 truncate max-w-[7rem]">👤 ' + (b.author || '未知') + '</span>' +
        '<span class="flex items-center gap-1 shrink-0">🕐 ' + fakeDate(b.id) + '</span>' +
        '<span class="flex items-center gap-1 shrink-0">👁 ' + fakeViews(b.id) + '</span>' +
        '<span class="ml-auto shrink-0 flex items-center gap-0.5 select-none">' + stars + '</span>' +
        '<a href="book/' + b.id + '" class="detail-link shrink-0 text-[#ff9500] hover:underline" title="' + (b.title || '').replace(/"/g, '&quot;') + ' 详情 / 章节目录" aria-label="查看 ' + (b.title || '').replace(/"/g, '&quot;') + ' 详情">详情›</a>' +
      '</div>' +
    '</div>';
  }

  // 事件委托：收藏 / 评分 / 卡片空白点击阅读（详情链接与标题链接走各自 href）
  document.addEventListener('click', function (e) {
    const fb = e.target.closest('.fav-btn');
    if (fb) { e.preventDefault(); e.stopPropagation(); toggleFav(fb.dataset.id); rerender(); return; }
    const st = e.target.closest('.star');
    if (st) {
      e.preventDefault(); e.stopPropagation();
      const id = st.dataset.id, val = +st.dataset.val;
      setRating(id, getRating(id) === val ? 0 : val);
      rerender();
      return;
    }
    // 「详情」链接 / 标题链接交给各自 <a href>（详情页 / 阅读页），不触发下面的整卡跳转
    if (e.target.closest('a')) return;
    // 点击卡片空白处 → 进入阅读（保留原「整卡可点」体验）
    const card = e.target.closest('.card');
    if (card && card.dataset.read) { window.location.href = card.dataset.read; }
  });

  // ---------- 分类（左侧侧栏：图片左侧模式 + 数量；移动端横滑同步） ----------
  // 固定分类体系（取自用户截图），顺序即展示顺序（用于随机推荐下拉等）
  const FIXED_CATEGORIES = ['全部','都市激情','校园之恋','人妻熟女','家庭乱伦','经验故事','真实体验','猎奇另类','短篇笑话','古典武侠','免费'];
  // 每个分类对应的 R2 缩略图 slug（tools/gen_cat_covers.py 生成，已上传到 cat/ 前缀）
  const CAT_IMG = {
    '全部':'all','都市激情':'dushi','校园之恋':'xiaoyuan','人妻熟女':'renqi',
    '家庭乱伦':'jiating','经验故事':'jingyan','真实体验':'zhenshi','猎奇另类':'lieqi',
    '短篇笑话':'duanpian','古典武侠':'gudian','免费':'free'
  };
  // 侧栏结构：都市激情 作为可展开父级，下面挂子分类（贴合截图）
  const CAT_TREE = [
    { name: '全部', type: 'all' },
    { name: '都市激情', type: 'parent', children: ['校园之恋','人妻熟女','家庭乱伦','经验故事','真实体验','猎奇另类','短篇笑话','古典武侠','免费'] }
  ];
  let catExpanded = true; // 默认展开，贴合截图

  // 分类左侧小图（真实图片；加载失败时回退为带首字的色块）
  function catImageHtml(name) {
    const slug = CAT_IMG[name] || 'all';
    const ch = (name || '?')[0];
    return '<img src="' + resolveUrl('cat/' + slug + '.jpg') + '" alt="' + name + '" ' +
      'loading="lazy" decoding="async" ' +
      'class="w-7 h-7 rounded-md object-cover shrink-0" ' +
      'onerror="this.onerror=null;var s=document.createElement(\'span\');s.className=\'inline-flex items-center justify-center w-7 h-7 rounded-md text-[12px] text-white shrink-0\';s.style.background=\'#ff950033\';s.textContent=\'' + ch + '\';this.replaceWith(s);" />';
  }
  function catCount(name) {
    if (name === '全部') return books.length;
    if (name === '免费') return books.filter(b => b.free === true).length;
    return books.filter(b => b.category === name).length;
  }
  function catRow(name, isParent, expanded) {
    const active = (name === activeCategory);
    const right = isParent
      ? '<span class="cat-chev ml-auto text-[10px] text-gray-400 transition-transform ' + (expanded ? 'rotate-90' : '') + '">▸</span>'
      : '<span class="ml-auto text-[11px] opacity-60 shrink-0 tabular-nums">' + catCount(name) + '</span>';
    return '<button data-cat="' + name + '" class="cat-btn flex items-center gap-2 w-full text-left px-2 py-1.5 rounded-lg text-sm transition ' +
      (active ? 'bg-[#ff9500] text-white' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#222]') + '">' +
      catImageHtml(name) +
      '<span class="flex-1 truncate">' + name + '</span>' + right + '</button>';
  }
  function catChildRow(name) {
    const active = (name === activeCategory);
    return '<button data-cat="' + name + '" class="cat-btn flex items-center gap-2 w-full text-left pl-9 pr-2 py-1.5 rounded-lg text-[13px] transition ' +
      (active ? 'bg-[#ff9500]/15 text-[#ff9500] dark:text-[#ffb84d]' : 'text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-[#222]') + '">' +
      catImageHtml(name) +
      '<span class="flex-1 truncate">' + name + '</span>' +
      '<span class="text-[11px] opacity-60 shrink-0 tabular-nums">' + catCount(name) + '</span></button>';
  }
  function renderCategories() {
    // 桌面侧栏：全部 + 都市激情（可展开父级）+ 子分类
    let html = catRow('全部', false, false);
    const parent = CAT_TREE[1];
    html += catRow(parent.name, true, catExpanded);
    if (catExpanded) parent.children.forEach(ch => { html += catChildRow(ch); });
    const listEl = $('catList'); if (listEl) listEl.innerHTML = html;

    // 移动端横滑：平铺全部分类（图片 + 名称）
    const barEl = $('catBar');
    if (barEl) barEl.innerHTML = FIXED_CATEGORIES.map(n => {
      const active = (n === activeCategory);
      return '<button data-cat="' + n + '" class="cat-btn shrink-0 flex items-center gap-1 px-2.5 py-1 rounded-full text-sm border whitespace-nowrap ' +
        (active ? 'bg-[#ff9500] text-white border-[#ff9500]' : 'bg-white dark:bg-[#141414] text-gray-600 dark:text-gray-300 border-gray-200 dark:border-[#333]') +
        '">' + catImageHtml(n) + n + '</button>';
    }).join('');

    // 事件绑定
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => { activeCategory = btn.dataset.cat; currentPage = 1; applyFilter(); });
    });
    document.querySelectorAll('.cat-chev').forEach(c => {
      c.addEventListener('click', (e) => { e.stopPropagation(); catExpanded = !catExpanded; renderCategories(); });
    });
  }

  // ---------- 过滤 + 排序 ----------
  function applyFilter() {
    const term = searchTerm.trim().toLowerCase();
    filtered = books.filter(b => {
      const matchCat = activeCategory === '全部' || (activeCategory === '免费' ? b.free === true : b.category === activeCategory);
      const matchTerm = !term || [b.title, b.author, b.category].some(v => (v || '').toLowerCase().includes(term));
      return matchCat && matchTerm;
    });
    // 排序：最新=id 倒序；热门=hot 优先；精华=评分优先
    filtered.sort((a, b) => {
      if (sortMode === 'hot') {
        const hv = (x) => (x.hot === true ? 1 : (typeof x.hot === 'number' ? x.hot : 0));
        const ha = hv(a), hb = hv(b);
        if (hb !== ha) return hb - ha;
      }
      if (sortMode === 'best') {
        const ra = getRating(a.id), rb = getRating(b.id);
        if (rb !== ra) return rb - ra;
      }
      return (b.id || 0) - (a.id || 0);
    });
    currentPage = 1;
    renderCategories(); // 刷新分类高亮
    renderBooks();

    // 随机推荐仅在「最新 + 无搜索 + 全部分类」时显示
    const showRandom = sortMode === 'latest' && !term && activeCategory === '全部' && books.length > 0;
    $('randomSection').classList.toggle('hidden', !showRandom);
    if (showRandom) renderRandom();
  }

  function rerender() {
    renderBooks();
    if (!$('randomSection').classList.contains('hidden')) renderRandom();
    renderShelf();
    syncPush();
  }

  // ---------- 我的书架 ----------
  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function shelfItemHtml(b) {
    const r = getRating(b.id);
    const stars = [1, 2, 3, 4, 5].map(v => '<span class="' + (v <= r ? 'text-amber-400' : 'text-gray-300 dark:text-gray-600') + '">★</span>').join('');
    return '<a href="read.html?id=' + b.id + '&u=' + encodeURIComponent(b.url || '') + '&t=' + encodeURIComponent(b.title || '') + (b.free ? '&free=1' : '') + '" class="block py-1">' +
      '<div class="font-medium truncate text-gray-800 dark:text-gray-100">' + escapeHtml(b.title) + '</div>' +
      '<div class="text-xs mt-0.5">' + stars + '</div>' +
    '</a>';
  }
  function renderShelf() {
    const favs = books.filter(b => isFav(b.id));
    const rated = books.filter(b => getRating(b.id) > 0);
    const sec = (title, list) => list.length === 0
      ? '<div class="text-gray-400"><span class="font-medium text-gray-600 dark:text-gray-300">' + title + '</span><div class="text-xs mt-1">暂无</div></div>'
      : '<div><div class="font-medium text-gray-600 dark:text-gray-300 mb-1">' + title + ' (' + list.length + ')</div>' + list.map(shelfItemHtml).join('') + '</div>';
    const html = sec('⭐ 我的收藏', favs) + sec('✍️ 我的评分', rated);
    const m = $('shelfBody'); if (m) m.innerHTML = html;
    const d = $('deskShelfBody'); if (d) d.innerHTML = html;
  }
  const shelfToggle = $('shelfToggle');
  if (shelfToggle) shelfToggle.addEventListener('click', () => {
    const body = $('shelfBody');
    const closed = body.classList.toggle('hidden');
    $('shelfArrow').style.transform = closed ? 'rotate(0deg)' : 'rotate(90deg)';
  });

  // ---------- 渲染书籍卡片 + 分页 ----------
  function renderBooks() {
    const total = filtered.length;
    const pages = Math.max(1, Math.ceil(total / PER_PAGE));
    if (currentPage > pages) currentPage = pages;
    const start = (currentPage - 1) * PER_PAGE;
    const list = filtered.slice(start, start + PER_PAGE);

    $('loading').classList.add('hidden');
    $('bookGrid').classList.remove('hidden');

    if (total === 0) {
      $('bookGrid').classList.add('hidden');
      $('empty').classList.remove('hidden');
      $('empty').classList.add('flex');
      $('pagination').classList.add('hidden');
      return;
    }
    $('empty').classList.add('hidden');
    $('empty').classList.remove('flex');
    $('pagination').classList.remove('hidden');

    $('bookGrid').innerHTML = list.map(cardHtml).join('');
    renderPagination(pages);
  }

  // ---------- 随机推荐 ----------
  function pickRandom() {
    let pool = books;
    if (randomCat === '免费') pool = pool.filter(b => b.free === true);
    else if (randomCat !== '全部') pool = pool.filter(b => b.category === randomCat);
    if (excludeRead) pool = pool.filter(b => !localStorage.getItem('ebook_progress_' + b.id));
    if (ratingFirst && pool.length > 4) {
      const sorted = pool.slice().sort((a, b) => getRating(b.id) - getRating(a.id));
      const topN = Math.max(4, Math.ceil(sorted.length / 2));
      pool = sorted.slice(0, topN);
    }
    if (favFirst) {
      const favs = pool.filter(b => isFav(b.id));
      if (favs.length > 0) {
        pool = favs.length >= 4 ? favs : favs.concat(pool.filter(b => !isFav(b.id)).slice(0, 4 - favs.length));
      }
    }
    if (unratedOnly) {
      const unrated = pool.filter(b => getRating(b.id) === 0);
      if (unrated.length > 0) pool = unrated;
    }
    const ids = pool.map(b => b.id);
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    currentRandom = ids.slice(0, Math.min(6, ids.length));
  }
  function populateRandomCat() {
    $('randomCat').innerHTML = FIXED_CATEGORIES.map(c => '<option value="' + c + '">' + c + '</option>').join('');
  }
  function setExcludeRead(on) {
    excludeRead = on;
    $('excludeReadBtn').className = 'text-sm px-3 py-1 rounded-lg border border-gray-200 dark:border-[#333] transition ' +
      (on ? 'bg-[#ff9500] text-white border-[#ff9500]' : 'bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#222]');
    pickRandom(); renderRandom();
  }
  function renderRandom() {
    if (currentRandom.length === 0) pickRandom();
    const sel = books.filter(b => currentRandom.includes(b.id));
    $('randomGrid').innerHTML = sel.map(cardHtml).join('');
  }
  $('shuffleBtn').addEventListener('click', () => { pickRandom(); renderRandom(); });
  $('randomCat').addEventListener('change', (e) => { randomCat = e.target.value; pickRandom(); renderRandom(); });
  $('excludeReadBtn').addEventListener('click', () => setExcludeRead(!excludeRead));
  function setRatingFirst(on) {
    ratingFirst = on;
    $('ratingFirstBtn').className = 'text-sm px-3 py-1 rounded-lg border border-gray-200 dark:border-[#333] transition ' +
      (on ? 'bg-[#ff9500] text-white border-[#ff9500]' : 'bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#222]');
    pickRandom(); renderRandom();
  }
  $('ratingFirstBtn').addEventListener('click', () => setRatingFirst(!ratingFirst));
  function setFavFirst(on) {
    favFirst = on;
    $('favFirstBtn').className = 'text-sm px-3 py-1 rounded-lg border border-gray-200 dark:border-[#333] transition ' +
      (on ? 'bg-[#ff9500] text-white border-[#ff9500]' : 'bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#222]');
    pickRandom(); renderRandom();
  }
  function setUnrated(on) {
    unratedOnly = on;
    $('unratedBtn').className = 'text-sm px-3 py-1 rounded-lg border border-gray-200 dark:border-[#333] transition ' +
      (on ? 'bg-[#ff9500] text-white border-[#ff9500]' : 'bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#222]');
    pickRandom(); renderRandom();
  }
  $('favFirstBtn').addEventListener('click', () => setFavFirst(!favFirst));
  $('unratedBtn').addEventListener('click', () => setUnrated(!unratedOnly));

  // 分页控件（贴合截图：上一页 / 页码(含省略号) / 下一页 / 第X/Y页 / 跳转输入框 + 跳转按钮）
  function renderPagination(pages) {
    if (pages <= 1) { $('pagination').innerHTML = ''; $('pagination').classList.add('hidden'); return; }
    const cur = currentPage;
    // 计算要显示的页码：始终含 1 与末页，含 当前±1，其余用省略号
    const set = new Set([1, pages, cur]);
    if (cur - 1 >= 1) set.add(cur - 1);
    if (cur + 1 <= pages) set.add(cur + 1);
    const sorted = [...set].sort((a, b) => a - b);
    const items = [];
    let prevN = 0;
    for (const n of sorted) {
      if (prevN && n - prevN > 1) items.push('…');
      items.push(n);
      prevN = n;
    }
    const base = 'min-w-[2.25rem] px-3 py-1.5 rounded-md text-sm transition';
    const inactive = 'bg-[#1a1a1a] text-gray-200 hover:bg-[#2a2a2a]';
    const active = 'bg-[#ff9500] text-white';
    const disabled = 'bg-[#141414] text-gray-600 cursor-not-allowed';
    let html = '';
    html += '<button ' + (cur === 1 ? 'disabled' : '') + ' data-page="' + (cur - 1) + '" class="' + base + ' ' + (cur === 1 ? disabled : inactive) + '">上一页</button>';
    for (const it of items) {
      if (it === '…') { html += '<span class="px-1 py-1.5 text-gray-500 select-none">…</span>'; continue; }
      const n = it;
      html += '<button data-page="' + n + '" class="' + base + ' ' + (n === cur ? active : inactive) + '">' + n + '</button>';
    }
    html += '<button ' + (cur === pages ? 'disabled' : '') + ' data-page="' + (cur + 1) + '" class="' + base + ' ' + (cur === pages ? disabled : inactive) + '">下一页</button>';
    html += '<span class="px-2 py-1.5 text-sm text-gray-400 select-none">第' + cur + '/' + pages + '页</span>';
    html += '<input id="jumpInput" type="number" min="1" max="' + pages + '" value="' + cur + '" class="w-16 px-2 py-1.5 rounded-md text-sm bg-[#1a1a1a] border border-[#333] text-gray-200 outline-none focus:border-[#ff9500] [appearance:textfield]" />';
    html += '<button id="jumpBtn" class="' + base + ' ' + active + '">跳转</button>';
    $('pagination').innerHTML = html;
    $('pagination').classList.remove('hidden');
    $('pagination').querySelectorAll('button[data-page]').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = +btn.dataset.page;
        if (p >= 1 && p <= pages) { currentPage = p; renderBooks(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      });
    });
    const doJump = () => {
      let v = parseInt($('jumpInput').value, 10);
      if (isNaN(v)) return;
      v = Math.max(1, Math.min(pages, v));
      currentPage = v; renderBooks(); window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    $('jumpBtn').addEventListener('click', doJump);
    $('jumpInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doJump(); });
  }

  $('search').addEventListener('input', (e) => { searchTerm = e.target.value; applyFilter(); });
  $('searchBtn').addEventListener('click', () => { applyFilter(); });

  // 排序 Tabs：最新 / 精华 / 热门
  function setSort(mode) {
    sortMode = mode;
    const on = 'tab flex-1 sm:flex-none px-4 py-2 text-sm font-medium border-b-2 -mb-px transition border-[#ff9500] text-[#ff9500] dark:text-[#ffb84d]';
    const off = 'tab flex-1 sm:flex-none px-4 py-2 text-sm font-medium border-b-2 -mb-px transition border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200';
    if ($('sortLatest')) $('sortLatest').className = mode === 'latest' ? on : off;
    if ($('sortBest')) $('sortBest').className = mode === 'best' ? on : off;
    if ($('sortHot')) $('sortHot').className = mode === 'hot' ? on : off;
    applyFilter();
  }
  $('sortLatest').addEventListener('click', () => setSort('latest'));
  $('sortBest').addEventListener('click', () => setSort('best'));
  $('sortHot').addEventListener('click', () => setSort('hot'));

  // 本机访问统计
  (function () {
    try {
      let n = parseInt(localStorage.getItem('ebook_visits') || '0', 10);
      n = isNaN(n) ? 1 : n + 1;
      localStorage.setItem('ebook_visits', String(n));
      const el = $('visitCount'); if (el) el.textContent = n;
    } catch (e) {}
  })();

  // ---------- 今日推荐 ----------
  // 与 tools/generate_promo.js 保持同源：分类白名单 + 未成年人/测试过滤 + 按日期稳定轮换
  const REC_SAFE_CATS = ['都市激情', '真实体验', '人妻熟女', '经验故事', '古典武侠'];
  const REC_MINOR_RE = /(未成年|蘿莉|罗莉|正太|幼女|幼童|雛女|雏女|小學生|小学生|國中|国中|初中生|高中生|高中|中學生|中学生|少年|少女|小孩|男童|女童|未滿|未满|[0-9]{1,2}[岁嵗]|幼|懵懂|蓓蕾|养成|養成)/i;
  const REC_TEST_RE = /(测试|測試|test|占位|示例|placeholder)/i;

  function recSeedIndex(seed, len) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h % Math.max(1, len);
  }
  function recPickDaily(cands, dayKey, count) {
    const out = [], used = new Set();
    let cursor = recSeedIndex(dayKey, cands.length);
    const stride = Math.max(1, Math.floor(cands.length / count));
    for (let i = 0; i < count && cands.length; i++) {
      let idx = (cursor + i * stride + recSeedIndex(dayKey + '#' + i, cands.length)) % cands.length;
      let guard = 0;
      while (used.has(idx) && guard++ < cands.length) idx = (idx + 1) % cands.length;
      used.add(idx); out.push(cands[idx]);
    }
    return out;
  }
  function recFallbackCandidates() {
    return books.filter(b =>
      REC_SAFE_CATS.indexOf(b.category) !== -1 &&
      !REC_MINOR_RE.test(b.title || '') && !REC_MINOR_RE.test(b.author || '') &&
      !REC_TEST_RE.test(b.title || '') && b.url && /^book\//.test(b.url)
    );
  }
  function renderRecCards(items) {
    const sec = $('dailyRec'), grid = $('dailyRecGrid');
    if (!sec || !grid || !items || !items.length) { if (sec) sec.classList.add('hidden'); return; }
    // items 可能是完整 book 对象（降级）或精简对象（out.json），用 id 映射回完整 book 以复用 cardHtml
    const html = items.map(it => {
      const full = books.find(b => String(b.id) === String(it.id));
      return full ? cardHtml(full) : '';
    }).filter(Boolean).join('');
    if (!html) { sec.classList.add('hidden'); return; }
    grid.innerHTML = html;
    const dEl = $('dailyRecDate');
    if (dEl) dEl.textContent = (items[0] && items[0].dayKey) || new Date().toISOString().slice(0, 10);
    sec.classList.remove('hidden');
  }
  function initDailyRec() {
    const cands = recFallbackCandidates();
    const dayKey = new Date().toISOString().slice(0, 10);
    // 优先用 Actions 生成的数据；线上/本地找不到 out.json 时静默降级，不报错
    fetch('promo/out.json', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('no out.json')))
      .then(o => {
        if (o && Array.isArray(o.books) && o.books.length) renderRecCards(o.books);
        else renderRecCards(recPickDaily(cands, dayKey, Math.min(3, cands.length)).map(b => ({ id: b.id })));
      })
      .catch(() => {
        renderRecCards(recPickDaily(cands, dayKey, Math.min(3, cands.length)).map(b => ({ id: b.id })));
      });
  }

  // 加载书库数据
  fetch('books.json').then(r => r.json()).then(data => {
    books = Array.isArray(data) ? data : [];
    allCategories = FIXED_CATEGORIES.filter(c => c !== '全部');
    populateRandomCat();
    renderCategories();
    renderShelf();
    applyFilter();
    initDailyRec();
  }).catch(err => {
    $('loading').classList.add('hidden');
    $('empty').classList.remove('hidden');
    $('empty').classList.add('flex');
    $('empty').innerHTML = '<div class="text-4xl mb-3">⚠️</div><p class="text-sm">books.json 加载失败，请通过本地服务器预览（见 README）。</p>';
  });

  // 启动
  updateAuthUI();
  if (getToken()) syncPull();
})();
</script>
