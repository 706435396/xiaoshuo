<!DOCTYPE html>
<html lang="zh-CN" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电子书库 · 在线阅读</title>
  <meta name="description" content="极简电子书索引站，支持 epub / pdf 在线阅读。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%234b5563'/%3E%3Crect%20x='9'%20y='8'%20width='3'%20height='16'%20rx='1'%20fill='white'/%3E%3Crect%20x='14'%20y='8'%20width='9'%20height='16'%20rx='1'%20fill='white'%20opacity='.85'/%3E%3C/svg%3E" />
  <!-- 主题初始化：避免刷新闪烁 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <!-- Tailwind CSS v3（CDN 引入） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .card-shadow { box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    .dark .card-shadow { box-shadow: 0 4px 16px rgba(0,0,0,.4); }
    .spinner { border: 3px solid rgba(120,120,120,.25); border-top-color: #6b7280; border-radius: 50%; width: 28px; height: 28px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-[#121212] dark:text-gray-200 transition-colors min-h-screen">
  <!-- 顶部导航栏 -->
  <header class="sticky top-0 z-10 bg-white/80 dark:bg-[#1a1a1a]/80 backdrop-blur border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
      <a href="index.html" class="font-semibold text-lg shrink-0">📚 电子书库</a>
      <div class="flex-1 max-w-md mx-auto">
        <input id="search" type="search" placeholder="搜索书名 / 作者 / 分类"
          class="w-full px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-[#2a2a2a] border border-transparent focus:border-gray-300 dark:focus:border-gray-600 outline-none text-sm" />
      </div>
      <button id="themeToggle" title="切换主题"
        class="shrink-0 w-9 h-9 rounded-lg bg-gray-100 dark:bg-[#2a2a2a] flex items-center justify-center hover:bg-gray-200 dark:hover:bg-[#333] transition">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <!-- 排序栏 -->
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-medium">全部书籍</h2>
      <div class="flex gap-2 text-sm">
        <button id="sortLatest" class="sort-btn px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900">最新</button>
        <button id="sortHot" class="sort-btn px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 bg-white text-gray-600 dark:bg-[#1a1a1a] dark:text-gray-300">热门</button>
      </div>
    </div>
    <!-- 分类标签筛选栏 -->
    <div id="categories" class="flex flex-wrap gap-2 mb-6"></div>

    <!-- 加载提示 -->
    <div id="loading" class="flex flex-col items-center justify-center py-20 text-gray-400">
      <div class="spinner mb-3"></div><span class="text-sm">加载中…</span>
    </div>

    <!-- 书籍卡片网格 -->
    <div id="bookGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    <!-- 空状态 -->
    <div id="empty" class="hidden flex-col items-center justify-center py-20 text-gray-400">
      <div class="text-4xl mb-3">🔍</div><p class="text-sm">没有找到匹配的书籍</p>
    </div>

    <!-- 分页 -->
    <div id="pagination" class="hidden flex flex-wrap justify-center items-center gap-2 mt-8"></div>
  </main>

  <footer class="max-w-6xl mx-auto px-4 py-8 text-center text-xs text-gray-400">
    <p>本站仅作书籍索引，电子书文件存储于外部链接。请仅上传拥有版权的作品。</p>
    <p class="mt-2">本机访问 <span id="visitCount">0</span> 次</p>
  </footer>

<script>
(function () {
  const PER_PAGE = 12;
  let books = [];
  let filtered = [];
  let activeCategory = '全部';
  let searchTerm = '';
  let currentPage = 1;
  let sortMode = 'latest';

  const $ = (id) => document.getElementById(id);

  // 暗黑模式切换
  function updateThemeIcon() {
    $('themeIcon').textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
  }
  $('themeToggle').addEventListener('click', function () {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    updateThemeIcon();
  });
  updateThemeIcon();

  // 封面加载失败时生成占位图
  function coverFallback(img) {
    img.onerror = null;
    img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="300" height="400" fill="#e5e7eb"/><text x="50%" y="50%" font-size="20" fill="#9ca3af" text-anchor="middle" dominant-baseline="middle">无封面</text></svg>'
    );
  }

  // 渲染分类标签（含「全部」）
  function renderCategories() {
    const cats = ['全部', ...Array.from(new Set(books.map(b => b.category).filter(Boolean)))];
    $('categories').innerHTML = cats.map(c =>
      '<button data-cat="' + c + '" class="cat-btn px-3 py-1 rounded-full text-sm border ' +
      (c === activeCategory ? 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900' :
        'bg-white text-gray-600 border-gray-200 dark:bg-[#1a1a1a] dark:text-gray-300 dark:border-gray-700') +
      '">' + c + '</button>'
    ).join('');
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => { activeCategory = btn.dataset.cat; currentPage = 1; renderCategories(); applyFilter(); });
    });
  }

  // 过滤（搜索 + 分类）
  function applyFilter() {
    const term = searchTerm.trim().toLowerCase();
    filtered = books.filter(b => {
      const matchCat = activeCategory === '全部' || b.category === activeCategory;
      const matchTerm = !term || [b.title, b.author, b.category].some(v => (v || '').toLowerCase().includes(term));
      return matchCat && matchTerm;
    });
    // 排序：最新=id 倒序；热门=hot 优先（true 或数值越大越前，false/缺省回退 id 倒序）
    filtered.sort((a, b) => {
      if (sortMode === 'hot') {
        const hv = (x) => (x.hot === true ? 1 : (typeof x.hot === 'number' ? x.hot : 0));
        const ha = hv(a), hb = hv(b);
        if (hb !== ha) return hb - ha;
      }
      return (b.id || 0) - (a.id || 0);
    });
    currentPage = 1;
    renderBooks();
  }

  // 渲染书籍卡片 + 分页
  function renderBooks() {
    const total = filtered.length;
    const pages = Math.max(1, Math.ceil(total / PER_PAGE));
    if (currentPage > pages) currentPage = pages;
    const start = (currentPage - 1) * PER_PAGE;
    const list = filtered.slice(start, start + PER_PAGE);

    $('loading').classList.add('hidden');
    $('bookGrid').classList.remove('hidden');

    if (total === 0) {
      $('bookGrid').classList.add('hidden');
      $('empty').classList.remove('hidden');
      $('empty').classList.add('flex');
      $('pagination').classList.add('hidden');
      return;
    }
    $('empty').classList.add('hidden');
    $('empty').classList.remove('flex');
    $('pagination').classList.remove('hidden');

    $('bookGrid').innerHTML = list.map(b => {
      const resume = localStorage.getItem('ebook_progress_' + b.id);
      return '<a href="read.html?id=' + b.id + '" class="card-shadow relative block rounded-xl overflow-hidden bg-white dark:bg-[#1a1a1a] hover:-translate-y-0.5 transition">' +
        (resume ? '<span class="absolute top-2 left-2 z-10 px-2 py-0.5 rounded-full text-[11px] bg-emerald-600 text-white">续读</span>' : '') +
        '<img src="' + (b.cover || '') + '" onerror="coverFallback(this)" alt="' + b.title + '" class="w-full aspect-[3/4] object-cover bg-gray-100 dark:bg-[#222]" loading="lazy" decoding="async" />' +
        '<div class="p-3">' +
          '<h3 class="font-medium text-sm line-clamp-1">' + b.title + '</h3>' +
          '<p class="text-xs text-gray-500 dark:text-gray-400 mt-1">' + (b.author || '未知作者') + '</p>' +
          '<span class="inline-block mt-2 text-xs px-2 py-0.5 rounded bg-gray-100 dark:bg-[#2a2a2a] text-gray-600 dark:text-gray-300">' + (b.category || '未分类') + '</span>' +
          '<p class="text-xs text-gray-500 dark:text-gray-400 mt-2 line-clamp-2">' + (b.intro || '') + '</p>' +
        '</div>' +
      '</a>';
    }).join('');

    renderPagination(pages);
  }

  // 分页控件
  function renderPagination(pages) {
    let html = '<button ' + (currentPage === 1 ? 'disabled' : '') + ' data-page="' + (currentPage - 1) + '" class="px-3 py-1 rounded-lg text-sm bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-700 disabled:opacity-40">上一页</button>';
    for (let i = 1; i <= pages; i++) {
      html += '<button data-page="' + i + '" class="px-3 py-1 rounded-lg text-sm ' + (i === currentPage ? 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900' : 'bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-700') + '">' + i + '</button>';
    }
    html += '<button ' + (currentPage === pages ? 'disabled' : '') + ' data-page="' + (currentPage + 1) + '" class="px-3 py-1 rounded-lg text-sm bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-700 disabled:opacity-40">下一页</button>';
    $('pagination').innerHTML = html;
    document.querySelectorAll('#pagination button').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = +btn.dataset.page;
        if (p >= 1 && p <= pages) { currentPage = p; renderBooks(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      });
    });
  }

  $('search').addEventListener('input', (e) => { searchTerm = e.target.value; applyFilter(); });

  // 排序：最新 / 热门
  function setSort(mode) {
    sortMode = mode;
    const base = 'sort-btn px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 ';
    $('sortLatest').className = base + (mode === 'latest' ? 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900' : 'bg-white text-gray-600 dark:bg-[#1a1a1a] dark:text-gray-300');
    $('sortHot').className = base + (mode === 'hot' ? 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900' : 'bg-white text-gray-600 dark:bg-[#1a1a1a] dark:text-gray-300');
    applyFilter();
  }
  $('sortLatest').addEventListener('click', () => setSort('latest'));
  $('sortHot').addEventListener('click', () => setSort('hot'));

  // 本机访问统计（纯前端 localStorage，不依赖任何第三方）
  (function () {
    try {
      let n = parseInt(localStorage.getItem('ebook_visits') || '0', 10);
      n = isNaN(n) ? 1 : n + 1;
      localStorage.setItem('ebook_visits', String(n));
      const el = $('visitCount'); if (el) el.textContent = n;
    } catch (e) {}
  })();

  // 加载书库数据
  fetch('books.json').then(r => r.json()).then(data => {
    books = Array.isArray(data) ? data : [];
    renderCategories();
    applyFilter();
  }).catch(err => {
    $('loading').classList.add('hidden');
    $('empty').classList.remove('hidden');
    $('empty').classList.add('flex');
    $('empty').innerHTML = '<div class="text-4xl mb-3">⚠️</div><p class="text-sm">books.json 加载失败，请通过本地服务器预览（见 README）。</p>';
  });
})();
</script>
</body>
</html>
