<!DOCTYPE html>
<html lang="zh-CN" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电子书库 · 在线阅读</title>
  <meta name="description" content="极简电子书索引站，支持 epub / pdf / txt 在线阅读，txt 自动切章、进度记忆、收藏评分。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%234b5563'/%3E%3Crect%20x='9'%20y='8'%20width='3'%20height='16'%20rx='1'%20fill='white'/%3E%3Crect%20x='14'%20y='8'%20width='9'%20height='16'%20rx='1'%20fill='white'%20opacity='.85'/%3E%3C/svg%3E" />
  <!-- 主题初始化：避免刷新闪烁 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <!-- Tailwind CSS v3（CDN 引入） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .card-shadow { box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    .dark .card-shadow { box-shadow: 0 4px 16px rgba(0,0,0,.4); }
    .spinner { border: 3px solid rgba(120,120,120,.25); border-top-color: #6b7280; border-radius: 50%; width: 28px; height: 28px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-[#121212] dark:text-gray-200 transition-colors min-h-screen">
  <!-- 顶部导航栏 -->
  <header class="sticky top-0 z-10 bg-white/80 dark:bg-[#1a1a1a]/80 backdrop-blur border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
      <a href="index.html" class="font-semibold text-lg shrink-0">📚 电子书库</a>
      <div class="flex-1 max-w-md mx-auto">
        <input id="search" type="search" placeholder="搜索书名 / 作者 / 分类"
          class="w-full px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-[#2a2a2a] border border-transparent focus:border-gray-300 dark:focus:border-gray-600 outline-none text-sm" />
      </div>
      <button id="authBtn" title="登录 / 注册"
        class="shrink-0 px-3 h-9 rounded-lg bg-gray-100 dark:bg-[#2a2a2a] flex items-center justify-center text-sm hover:bg-gray-200 dark:hover:bg-[#333] transition">登录</button>
      <button id="themeToggle" title="切换主题"
        class="shrink-0 w-9 h-9 rounded-lg bg-gray-100 dark:bg-[#2a2a2a] flex items-center justify-center hover:bg-gray-200 dark:hover:bg-[#333] transition">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 lg:pr-[15rem]">
    <!-- 移动端：我的书架（可折叠，lg 以上隐藏，桌面改用右侧侧栏） -->
    <section id="mobileShelf" class="lg:hidden mb-6 card-shadow rounded-xl bg-white dark:bg-[#1a1a1a] p-4">
      <button id="shelfToggle" class="flex items-center justify-between w-full text-left">
        <span class="text-base font-medium">我的书架</span>
        <span id="shelfArrow" class="text-gray-400 transition-transform">▸</span>
      </button>
      <div id="shelfBody" class="hidden mt-3 space-y-3"></div>
    </section>

    <!-- 随机推荐区块 -->
    <section id="randomSection" class="mb-8">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base font-medium">随机推荐</h2>
        <div class="flex items-center gap-2 flex-wrap">
          <select id="randomCat" class="text-sm px-2 py-1 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300 outline-none max-w-[120px]"></select>
          <button id="excludeReadBtn" class="text-sm px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#222] transition">排除已读</button>
          <button id="ratingFirstBtn" class="text-sm px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#222] transition">评分优先</button>
          <button id="favFirstBtn" class="text-sm px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#222] transition">收藏优先</button>
          <button id="unratedBtn" class="text-sm px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#222] transition">只看未评分</button>
          <button id="shuffleBtn" class="text-sm px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#222] transition">换一批</button>
        </div>
      </div>
      <div id="randomGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </section>

    <!-- 排序 / 筛选栏 -->
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-medium">全部书籍</h2>
      <div class="flex gap-2 text-sm">
        <button id="sortLatest" class="sort-btn px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900">最新</button>
        <button id="sortHot" class="sort-btn px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 bg-white text-gray-600 dark:bg-[#1a1a1a] dark:text-gray-300">热门</button>
        <button id="sortFav" class="sort-btn px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 bg-white text-gray-600 dark:bg-[#1a1a1a] dark:text-gray-300">收藏</button>
      </div>
    </div>
    <!-- 分类标签筛选栏 -->
    <div id="categories" class="flex flex-wrap gap-2 mb-6"></div>

    <!-- 加载提示 -->
    <div id="loading" class="flex flex-col items-center justify-center py-20 text-gray-400">
      <div class="spinner mb-3"></div><span class="text-sm">加载中…</span>
    </div>

    <!-- 书籍卡片网格 -->
    <div id="bookGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    <!-- 空状态 -->
    <div id="empty" class="hidden flex-col items-center justify-center py-20 text-gray-400">
      <div class="text-4xl mb-3">🔍</div><p class="text-sm">没有找到匹配的书籍</p>
    </div>

    <!-- 分页 -->
    <div id="pagination" class="hidden flex flex-wrap justify-center items-center gap-2 mt-8"></div>
  </main>

  <footer class="max-w-6xl mx-auto px-4 py-8 text-center text-xs text-gray-400 lg:pr-[15rem]">
    <p>本站仅作书籍索引，电子书文件存储于外部链接。请仅上传拥有版权的作品。</p>
    <p class="mt-2">本机访问 <span id="visitCount">0</span> 次</p>
  </footer>

  <!-- 桌面：我的书架侧栏（固定右侧，lg 以上显示；移动端改用顶部折叠区块） -->
  <aside id="deskShelf" class="hidden lg:block fixed top-20 right-3 w-56 max-h-[calc(100vh-6rem)] overflow-y-auto card-shadow rounded-xl bg-white dark:bg-[#1a1a1a] p-4 z-10">
    <h3 class="text-sm font-medium mb-3">我的书架</h3>
    <div id="deskShelfBody" class="space-y-4 text-sm"></div>
  </aside>

  <!-- 登录 / 注册 模态框 -->
  <div id="authModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4">
    <div class="w-full max-w-sm card-shadow rounded-xl bg-white dark:bg-[#1a1a1a] p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 id="authTitle" class="text-base font-medium">登录</h3>
        <button id="authClose" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-lg leading-none">✕</button>
      </div>
      <div class="flex gap-2 mb-4 text-sm">
        <button id="tabLogin" class="auth-tab flex-1 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900">登录</button>
        <button id="tabReg" class="auth-tab flex-1 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300">注册</button>
      </div>
      <input id="authUser" type="text" placeholder="用户名（中英文/数字，1-32）" autocomplete="username"
        class="w-full px-3 py-2 mb-3 rounded-lg bg-gray-100 dark:bg-[#2a2a2a] border border-transparent focus:border-gray-300 dark:focus:border-gray-600 outline-none text-sm" />
      <input id="authPwd" type="password" placeholder="密码（至少6位）" autocomplete="current-password"
        class="w-full px-3 py-2 mb-3 rounded-lg bg-gray-100 dark:bg-[#2a2a2a] border border-transparent focus:border-gray-300 dark:focus:border-gray-600 outline-none text-sm" />
      <p id="authMsg" class="text-xs text-red-500 min-h-[1rem] mb-2"></p>
      <button id="authSubmit" class="w-full py-2 rounded-lg bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900 text-sm hover:opacity-90 transition">登录</button>
      <p class="text-xs text-gray-400 mt-3 text-center">登录后收藏 / 评分 / 阅读进度将云端同步，可跨设备。</p>
    </div>
  </div>

<script>
(function () {
  const PER_PAGE = 12;
  // R2 公共域名前缀：books.json 中 url/cover 只存路径(key)，运行时拼回完整直链，省体积
  const R2_BASE = 'https://pub-0286f9f1305243479f676d853bc3c827.r2.dev/';
  const resolveUrl = (v) => (v ? R2_BASE + v : '');
  let books = [];
  let filtered = [];
  let activeCategory = '全部';
  let searchTerm = '';
  let currentPage = 1;
  let sortMode = 'latest';
  let currentRandom = []; // 当前随机推荐选中的 id 列表
  let randomCat = '全部';   // 随机推荐所选分类（全部=全局随机）
  let excludeRead = false;  // 随机推荐是否排除已读
  let ratingFirst = false; // 随机推荐是否评分优先
  let favFirst = false;    // 随机推荐是否收藏优先
  let unratedOnly = false; // 随机推荐是否只看未评分
  let allCategories = [];   // 全部分类列表

  const $ = (id) => document.getElementById(id);

  // ---------- 账号登录 + 进度云同步（Pages Functions + KV，无独立后端） ----------
  const AUTH_KEY = 'ebook_token', USER_KEY = 'ebook_user';
  function getToken() { try { return localStorage.getItem(AUTH_KEY); } catch (e) { return null; } }
  function getCurUser() { try { return localStorage.getItem(USER_KEY); } catch (e) { return null; } }
  async function apiCall(path, opts = {}) {
    const token = getToken();
    const headers = Object.assign({ 'content-type': 'application/json' }, opts.headers || {});
    if (token) headers['authorization'] = 'Bearer ' + token;
    try {
      const res = await fetch('/api' + path, Object.assign({ method: opts.method || 'GET', headers }, opts.body ? { body: opts.body } : {}));
      let data = {}; try { data = await res.json(); } catch (e) {}
      return { ok: res.ok, status: res.status, data };
    } catch (e) { return { ok: false, status: 0, data: { error: '网络错误' } }; }
  }
  // 收集本地收藏/评分/进度，打包上传
  function collectLocal() {
    const favs = [...getFavs()];
    const ratings = {}, progress = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i); if (!k) continue;
      if (k.indexOf('ebook_rating_') === 0) ratings[k.slice(13)] = parseInt(localStorage.getItem(k), 10) || 0;
      else if (k.indexOf('ebook_progress_') === 0) progress[k.slice(15)] = localStorage.getItem(k);
    }
    return { favs, ratings, progress };
  }
  // 登录后拉取云端并合并（云端优先于本地冲突项）
  async function syncPull() {
    const r = await apiCall('/progress');
    if (r.status === 401) { logout(); return; }
    if (!r.ok) return;
    const d = r.data || {};
    const cur = getFavs();
    (d.favs || []).forEach(id => cur.add(String(id)));
    try { localStorage.setItem('ebook_favs', JSON.stringify([...cur])); } catch (e) {}
    const ratings = d.ratings || {};
    for (const id in ratings) if (ratings[id]) localStorage.setItem('ebook_rating_' + id, String(ratings[id]));
    const progress = d.progress || {};
    for (const id in progress) if (progress[id]) localStorage.setItem('ebook_progress_' + id, progress[id]);
    if (books.length) { rerender(); renderShelf(); }
  }
  let pushTimer = null;
  function syncPush() {
    if (!getToken()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(async () => {
      const r = await apiCall('/progress', { method: 'PUT', body: JSON.stringify(collectLocal()) });
      if (r.status === 401) logout();
    }, 800);
  }
  function onAuthed(token, user) {
    localStorage.setItem(AUTH_KEY, token);
    localStorage.setItem(USER_KEY, user);
    updateAuthUI();
    syncPull().then(syncPush);
  }
  function logout() {
    localStorage.removeItem(AUTH_KEY); localStorage.removeItem(USER_KEY);
    updateAuthUI();
  }
  function updateAuthUI() {
    const b = $('authBtn'); if (!b) return;
    const u = getCurUser();
    b.textContent = u ? (u + ' · 退出') : '登录';
  }
  let authMode = 'login';
  function switchAuthTab(mode) {
    authMode = mode;
    $('authTitle').textContent = mode === 'login' ? '登录' : '注册';
    $('authSubmit').textContent = mode === 'login' ? '登录' : '注册';
    const on = 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900';
    const off = 'bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300';
    $('tabLogin').className = 'auth-tab flex-1 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 ' + (mode === 'login' ? on : off);
    $('tabReg').className = 'auth-tab flex-1 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 ' + (mode === 'reg' ? on : off);
  }
  function openAuth(mode) { switchAuthTab(mode); $('authMsg').textContent = ''; $('authUser').value = ''; $('authPwd').value = ''; $('authModal').classList.remove('hidden'); setTimeout(() => $('authUser').focus(), 50); }
  function closeAuth() { $('authModal').classList.add('hidden'); }
  async function submitAuth() {
    const name = $('authUser').value.trim(), pwd = $('authPwd').value;
    if (!name || !pwd) { $('authMsg').textContent = '请输入用户名和密码'; return; }
    $('authSubmit').disabled = true;
    const r = await apiCall('/' + authMode, { method: 'POST', body: JSON.stringify({ username: name, password: pwd }) });
    $('authSubmit').disabled = false;
    if (r.ok) { closeAuth(); onAuthed(r.data.token, r.data.username); }
    else $('authMsg').textContent = r.data.error || '操作失败';
  }
  $('authBtn').addEventListener('click', () => { if (getCurUser()) logout(); else openAuth('login'); });
  $('authClose').addEventListener('click', closeAuth);
  $('authModal').addEventListener('click', (e) => { if (e.target === $('authModal')) closeAuth(); });
  $('tabLogin').addEventListener('click', () => switchAuthTab('login'));
  $('tabReg').addEventListener('click', () => switchAuthTab('reg'));
  $('authSubmit').addEventListener('click', submitAuth);
  $('authPwd').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAuth(); });
  $('authUser').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('authPwd').focus(); });

  // ---------- 收藏 / 评分（localStorage，无后端） ----------
  function getFavs() {
    try { return new Set(JSON.parse(localStorage.getItem('ebook_favs') || '[]')); } catch (e) { return new Set(); }
  }
  function isFav(id) { return getFavs().has(String(id)); }
  function toggleFav(id) {
    const s = getFavs(); const k = String(id);
    if (s.has(k)) s.delete(k); else s.add(k);
    try { localStorage.setItem('ebook_favs', JSON.stringify([...s])); } catch (e) {}
  }
  function getRating(id) {
    try { return parseInt(localStorage.getItem('ebook_rating_' + id) || '0', 10) || 0; } catch (e) { return 0; }
  }
  function setRating(id, v) {
    try {
      if (v <= 0) localStorage.removeItem('ebook_rating_' + id);
      else localStorage.setItem('ebook_rating_' + id, String(v));
    } catch (e) {}
  }

  // ---------- 暗黑模式切换 ----------
  function updateThemeIcon() {
    $('themeIcon').textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
  }
  $('themeToggle').addEventListener('click', function () {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    updateThemeIcon();
  });
  updateThemeIcon();

  // 封面加载失败时生成占位图
  function coverFallback(img) {
    img.onerror = null;
    img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="300" height="400" fill="#e5e7eb"/><text x="50%" y="50%" font-size="20" fill="#9ca3af" text-anchor="middle" dominant-baseline="middle">无封面</text></svg>'
    );
  }

  // 单张卡片 HTML（含收藏按钮 + 星级评分），首页与随机推荐共用
  function cardHtml(b) {
    const fav = isFav(b.id);
    const rating = getRating(b.id);
    const resume = localStorage.getItem('ebook_progress_' + b.id);
    const stars = [1,2,3,4,5].map(v =>
      '<span class="star cursor-pointer ' + (v <= rating ? 'text-amber-400' : 'text-gray-300 dark:text-gray-600') + '" data-id="' + b.id + '" data-val="' + v + '">★</span>'
    ).join('');
    return '<a href="read.html?id=' + b.id + '" class="card-shadow relative block rounded-xl overflow-hidden bg-white dark:bg-[#1a1a1a] hover:-translate-y-0.5 transition">' +
      (resume ? '<span class="absolute top-2 left-2 z-10 px-2 py-0.5 rounded-full text-[11px] bg-emerald-600 text-white">续读</span>' : '') +
      '<button class="fav-btn absolute top-2 right-2 z-10 w-7 h-7 rounded-full flex items-center justify-center text-sm ' + (fav ? 'bg-rose-500 text-white' : 'bg-black/30 text-white') + '" data-id="' + b.id + '" title="收藏">♥</button>' +
      '<img src="' + resolveUrl(b.cover) + '" onerror="coverFallback(this)" alt="' + b.title + '" class="w-full aspect-[3/4] object-cover bg-gray-100 dark:bg-[#222]" loading="lazy" decoding="async" />' +
      '<div class="p-3">' +
        '<h3 class="font-medium text-sm line-clamp-1">' + b.title + '</h3>' +
        '<p class="text-xs text-gray-500 dark:text-gray-400 mt-1">' + (b.author || '未知作者') + '</p>' +
        '<div class="flex items-center justify-between mt-2">' +
          '<span class="text-xs px-2 py-0.5 rounded bg-gray-100 dark:bg-[#2a2a2a] text-gray-600 dark:text-gray-300">' + (b.category || '未分类') + '</span>' +
          '<span class="text-xs text-gray-400 select-none">' + stars + '</span>' +
        '</div>' +
        '<p class="text-xs text-gray-500 dark:text-gray-400 mt-2 line-clamp-2">' + (b.intro || '') + '</p>' +
      '</div>' +
    '</a>';
  }

  // 事件委托：收藏 / 评分（避免逐卡片绑定，且防止触发卡片跳转）
  document.addEventListener('click', function (e) {
    const fb = e.target.closest('.fav-btn');
    if (fb) { e.preventDefault(); e.stopPropagation(); toggleFav(fb.dataset.id); rerender(); return; }
    const st = e.target.closest('.star');
    if (st) {
      e.preventDefault(); e.stopPropagation();
      const id = st.dataset.id, val = +st.dataset.val;
      setRating(id, getRating(id) === val ? 0 : val);
      rerender();
      return;
    }
  });

  // ---------- 分类标签 ----------
  function renderCategories() {
    const cats = ['全部', ...Array.from(new Set(books.map(b => b.category).filter(Boolean)))];
    $('categories').innerHTML = cats.map(c =>
      '<button data-cat="' + c + '" class="cat-btn px-3 py-1 rounded-full text-sm border ' +
      (c === activeCategory ? 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900' :
        'bg-white text-gray-600 border-gray-200 dark:bg-[#1a1a1a] dark:text-gray-300 dark:border-gray-700') +
      '">' + c + '</button>'
    ).join('');
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => { activeCategory = btn.dataset.cat; currentPage = 1; applyFilter(); });
    });
  }

  // ---------- 过滤 + 排序 ----------
  function applyFilter() {
    const term = searchTerm.trim().toLowerCase();
    filtered = books.filter(b => {
      const matchCat = activeCategory === '全部' || b.category === activeCategory;
      const matchTerm = !term || [b.title, b.author, b.category].some(v => (v || '').toLowerCase().includes(term));
      return matchCat && matchTerm;
    });
    // 收藏筛选模式：仅保留已收藏
    if (sortMode === 'fav') filtered = filtered.filter(b => isFav(b.id));
    // 排序：最新=id 倒序；热门=hot 优先；其余回退 id 倒序
    filtered.sort((a, b) => {
      if (sortMode === 'hot') {
        const hv = (x) => (x.hot === true ? 1 : (typeof x.hot === 'number' ? x.hot : 0));
        const ha = hv(a), hb = hv(b);
        if (hb !== ha) return hb - ha;
      }
      return (b.id || 0) - (a.id || 0);
    });
    currentPage = 1;
    renderBooks();

    // 随机推荐仅在「无搜索 + 全部分类 + 非收藏」时显示
    const showRandom = !term && activeCategory === '全部' && sortMode !== 'fav' && books.length > 0;
    $('randomSection').classList.toggle('hidden', !showRandom);
    if (showRandom) renderRandom();
  }

  // 收藏 / 评分变更后只重渲染，不影响分页位置
  function rerender() {
    renderBooks();
    if (!$('randomSection').classList.contains('hidden')) renderRandom();
    renderShelf();
    syncPush(); // 已登录则防抖上传到云端
  }

  // ---------- 我的书架（收藏 + 评分独立面板，桌面侧栏 / 移动端折叠区块共用） ----------
  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function shelfItemHtml(b) {
    const r = getRating(b.id);
    const stars = [1, 2, 3, 4, 5].map(v => '<span class="' + (v <= r ? 'text-amber-400' : 'text-gray-300 dark:text-gray-600') + '">★</span>').join('');
    return '<a href="read.html?id=' + b.id + '" class="block py-1">' +
      '<div class="font-medium truncate">' + escapeHtml(b.title) + '</div>' +
      '<div class="text-xs mt-0.5">' + stars + '</div>' +
    '</a>';
  }
  function renderShelf() {
    const favs = books.filter(b => isFav(b.id));
    const rated = books.filter(b => getRating(b.id) > 0);
    const sec = (title, list) => list.length === 0
      ? '<div class="text-gray-400"><span class="font-medium text-gray-600 dark:text-gray-300">' + title + '</span><div class="text-xs mt-1">暂无</div></div>'
      : '<div><div class="font-medium text-gray-600 dark:text-gray-300 mb-1">' + title + ' (' + list.length + ')</div>' + list.map(shelfItemHtml).join('') + '</div>';
    const html = sec('⭐ 我的收藏', favs) + sec('✍️ 我的评分', rated);
    const m = $('shelfBody'); if (m) m.innerHTML = html;
    const d = $('deskShelfBody'); if (d) d.innerHTML = html;
  }
  // 移动端书架折叠
  const shelfToggle = $('shelfToggle');
  if (shelfToggle) shelfToggle.addEventListener('click', () => {
    const body = $('shelfBody');
    const closed = body.classList.toggle('hidden');
    $('shelfArrow').style.transform = closed ? 'rotate(0deg)' : 'rotate(90deg)';
  });

  // ---------- 渲染书籍卡片 + 分页 ----------
  function renderBooks() {
    const total = filtered.length;
    const pages = Math.max(1, Math.ceil(total / PER_PAGE));
    if (currentPage > pages) currentPage = pages;
    const start = (currentPage - 1) * PER_PAGE;
    const list = filtered.slice(start, start + PER_PAGE);

    $('loading').classList.add('hidden');
    $('bookGrid').classList.remove('hidden');

    if (total === 0) {
      $('bookGrid').classList.add('hidden');
      $('empty').classList.remove('hidden');
      $('empty').classList.add('flex');
      $('pagination').classList.add('hidden');
      return;
    }
    $('empty').classList.add('hidden');
    $('empty').classList.remove('flex');
    $('pagination').classList.remove('hidden');

    $('bookGrid').innerHTML = list.map(cardHtml).join('');
    renderPagination(pages);
  }

  // ---------- 随机推荐 ----------
  function pickRandom() {
    let pool = books;
    if (randomCat !== '全部') pool = pool.filter(b => b.category === randomCat);
    if (excludeRead) pool = pool.filter(b => !localStorage.getItem('ebook_progress_' + b.id));
    if (ratingFirst && pool.length > 4) {
      // 评分优先：按评分降序取前一半作为候选，高评分更易出现；评分全 0 时退化为普通随机
      const sorted = pool.slice().sort((a, b) => getRating(b.id) - getRating(a.id));
      const topN = Math.max(4, Math.ceil(sorted.length / 2));
      pool = sorted.slice(0, topN);
    }
    if (favFirst) {
      // 收藏优先：已收藏的书优先入选；不足 4 本时用未收藏补足；无收藏则退化为普通随机
      const favs = pool.filter(b => isFav(b.id));
      if (favs.length > 0) {
        pool = favs.length >= 4 ? favs : favs.concat(pool.filter(b => !isFav(b.id)).slice(0, 4 - favs.length));
      }
    }
    if (unratedOnly) {
      // 只看未评分：仅保留评分=0 的书；若无未评分则退化为普通随机（保持原 pool）
      const unrated = pool.filter(b => getRating(b.id) === 0);
      if (unrated.length > 0) pool = unrated;
    }
    const ids = pool.map(b => b.id);
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    currentRandom = ids.slice(0, Math.min(4, ids.length));
  }
  function populateRandomCat() {
    $('randomCat').innerHTML = ['全部', ...allCategories].map(c => '<option value="' + c + '">' + c + '</option>').join('');
  }
  function setExcludeRead(on) {
    excludeRead = on;
    $('excludeReadBtn').className = 'text-sm px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 transition ' +
      (on ? 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900' : 'bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#222]');
    pickRandom(); renderRandom();
  }
  function renderRandom() {
    if (currentRandom.length === 0) pickRandom();
    const sel = books.filter(b => currentRandom.includes(b.id));
    $('randomGrid').innerHTML = sel.map(cardHtml).join('');
  }
  $('shuffleBtn').addEventListener('click', () => { pickRandom(); renderRandom(); });
  $('randomCat').addEventListener('change', (e) => { randomCat = e.target.value; pickRandom(); renderRandom(); });
  $('excludeReadBtn').addEventListener('click', () => setExcludeRead(!excludeRead));
  function setRatingFirst(on) {
    ratingFirst = on;
    $('ratingFirstBtn').className = 'text-sm px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 transition ' +
      (on ? 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900' : 'bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#222]');
    pickRandom(); renderRandom();
  }
  $('ratingFirstBtn').addEventListener('click', () => setRatingFirst(!ratingFirst));
  function setFavFirst(on) {
    favFirst = on;
    $('favFirstBtn').className = 'text-sm px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 transition ' +
      (on ? 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900' : 'bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#222]');
    pickRandom(); renderRandom();
  }
  function setUnrated(on) {
    unratedOnly = on;
    $('unratedBtn').className = 'text-sm px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 transition ' +
      (on ? 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900' : 'bg-white dark:bg-[#1a1a1a] text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#222]');
    pickRandom(); renderRandom();
  }
  $('favFirstBtn').addEventListener('click', () => setFavFirst(!favFirst));
  $('unratedBtn').addEventListener('click', () => setUnrated(!unratedOnly));

  // 分页控件
  function renderPagination(pages) {
    let html = '<button ' + (currentPage === 1 ? 'disabled' : '') + ' data-page="' + (currentPage - 1) + '" class="px-3 py-1 rounded-lg text-sm bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-700 disabled:opacity-40">上一页</button>';
    for (let i = 1; i <= pages; i++) {
      html += '<button data-page="' + i + '" class="px-3 py-1 rounded-lg text-sm ' + (i === currentPage ? 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900' : 'bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-700') + '">' + i + '</button>';
    }
    html += '<button ' + (currentPage === pages ? 'disabled' : '') + ' data-page="' + (currentPage + 1) + '" class="px-3 py-1 rounded-lg text-sm bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-700 disabled:opacity-40">下一页</button>';
    $('pagination').innerHTML = html;
    document.querySelectorAll('#pagination button').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = +btn.dataset.page;
        if (p >= 1 && p <= pages) { currentPage = p; renderBooks(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      });
    });
  }

  $('search').addEventListener('input', (e) => { searchTerm = e.target.value; applyFilter(); });

  // 排序：最新 / 热门 / 收藏
  function setSort(mode) {
    sortMode = mode;
    const base = 'sort-btn px-3 py-1 rounded-lg border border-gray-200 dark:border-gray-700 ';
    const on = 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900';
    const off = 'bg-white text-gray-600 dark:bg-[#1a1a1a] dark:text-gray-300';
    $('sortLatest').className = base + (mode === 'latest' ? on : off);
    $('sortHot').className = base + (mode === 'hot' ? on : off);
    $('sortFav').className = base + (mode === 'fav' ? on : off);
    applyFilter();
  }
  $('sortLatest').addEventListener('click', () => setSort('latest'));
  $('sortHot').addEventListener('click', () => setSort('hot'));
  $('sortFav').addEventListener('click', () => setSort('fav'));

  // 本机访问统计（纯前端 localStorage，不依赖任何第三方）
  (function () {
    try {
      let n = parseInt(localStorage.getItem('ebook_visits') || '0', 10);
      n = isNaN(n) ? 1 : n + 1;
      localStorage.setItem('ebook_visits', String(n));
      const el = $('visitCount'); if (el) el.textContent = n;
    } catch (e) {}
  })();

  // 加载书库数据
  fetch('books.json').then(r => r.json()).then(data => {
    books = Array.isArray(data) ? data : [];
    allCategories = Array.from(new Set(books.map(b => b.category).filter(Boolean)));
    populateRandomCat();
    renderCategories();
    renderShelf();
    applyFilter();
  }).catch(err => {
    $('loading').classList.add('hidden');
    $('empty').classList.remove('hidden');
    $('empty').classList.add('flex');
    $('empty').innerHTML = '<div class="text-4xl mb-3">⚠️</div><p class="text-sm">books.json 加载失败，请通过本地服务器预览（见 README）。</p>';
  });

  // 启动：刷新登录态；已登录则拉取云端进度合并（本地数据随后在渲染中体现）
  updateAuthUI();
  if (getToken()) syncPull();
})();
</script>
</body>
</html>
