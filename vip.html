<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>会员管理 | 深夜文库</title>
<style>
  :root{--bg:#0d0d0d;--card:#161616;--fg:#e5e5e5;--muted:#9a9a9a;--orange:#ff9500;--line:#262626}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
  .wrap{max-width:520px;margin:60px auto;padding:0 20px}
  h1{font-size:20px;margin:0 0 6px}
  .hint{color:var(--muted);font-size:13px;margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  input{width:100%;background:#0a0a0a;border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:10px 12px;font-size:14px;outline:none}
  input:focus{border-color:var(--orange)}
  button{margin-top:20px;width:100%;background:var(--orange);color:#111;border:0;border-radius:8px;padding:11px;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .msg{margin-top:16px;font-size:13px;min-height:20px}
  .ok{color:#5ad48a}.err{color:#ff7a7a}
  a{color:var(--orange)}
  .foot{margin-top:24px;font-size:12px;color:#666;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <h1>会员管理 · 深夜文库</h1>
  <div class="hint">此页面不对外公开，仅用于手动开通/续费会员。</div>
  <div class="card">
    <label>管理员密钥</label>
    <input id="secret" type="password" placeholder="ADMIN_SECRET" />
    <label>用户名（大小写敏感，须与注册时一致）</label>
    <input id="username" type="text" placeholder="例如：zhangsan" />
    <label>开通天数（1-3650，留空默认 30 天；未过期则顺延）</label>
    <input id="days" type="number" value="30" min="1" max="3650" />
    <button id="btn">开通 / 续费</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="foot">
    未配置环境变量时，起步密钥为 <code>shenye-vip-2026</code>（建议尽快在 Cloudflare Pages → 设置 → 环境变量中新增 <code>ADMIN_SECRET</code> 覆盖，并妥善保管）。<br />
    <a href="/">返回首页</a>
  </div>
</div>

<div class="wrap" style="margin-top:8px;max-width:900px">
  <h1>京东E卡兑换审核</h1>
  <div class="hint">先开通后复核模式：用户提交卡号卡密后会员已自动生效，订单进入「待复核」。点「查看卡密」解密，去京东核验卡密是否有效未使用——有效则点「通过保留」，无效则点「驳回并撤销」（会回滚该用户本次会员天数）。处理完成后卡密密文立即销毁。</div>
  <div class="card">
    <label>管理员密钥（与上方相同）</label>
    <input id="admSecret" type="password" placeholder="ADMIN_SECRET" />
    <button id="loadOrders" style="margin-top:14px">加载订单列表</button>
    <button id="testNotify" style="margin-top:10px;background:#2a2a2a;color:var(--fg);border:1px solid var(--line)">发送测试通知</button>
    <div class="msg" id="admMsg"></div>
    <div id="orderList" style="margin-top:16px"></div>
  </div>
</div>
<style>
  .tbl{width:100%;border-collapse:collapse;font-size:12px}
  .tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
  .tbl th{color:var(--muted);font-weight:500}
  .badge{padding:1px 7px;border-radius:20px;font-size:11px;white-space:nowrap}
  .b-active{background:#1c3350;color:#7ec0ff}.b-approved{background:#123a22;color:#5ad48a}.b-rejected{background:#3a1414;color:#ff7a7a}.b-pending{background:#3a2f10;color:#d8b96a}
  .ops button{margin:2px 4px 2px 0;width:auto;padding:5px 10px;font-size:12px}
  .ops .reject{background:#3a1414;color:#ff9a9a}
  .cardpwd{background:#000;padding:6px 10px;border-radius:6px;color:#ffb54d;font-family:monospace;letter-spacing:1px}
</style>
<script>
  const $ = id => document.getElementById(id);
  $('btn').addEventListener('click', async () => {
    const secret = $('secret').value.trim();
    const username = $('username').value.trim();
    const days = $('days').value;
    if (!secret || !username) { $('msg').className = 'msg err'; $('msg').textContent = '请填写密钥和用户名'; return; }
    $('btn').disabled = true;
    $('msg').className = 'msg'; $('msg').textContent = '提交中…';
    try {
      const res = await fetch('/api/grant', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-admin-secret': secret },
        body: JSON.stringify({ username, days: days ? Number(days) : 30 })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        $('msg').className = 'msg ok';
        $('msg').textContent = '✅ 已开通：' + data.username + ' 会员至 ' + data.vipUntil;
      } else {
        $('msg').className = 'msg err';
        $('msg').textContent = '❌ ' + (data.error || ('失败 HTTP ' + res.status));
      }
    } catch (e) {
      $('msg').className = 'msg err'; $('msg').textContent = '网络错误：' + e.message;
    }
    $('btn').disabled = false;
  });

  // ===== 京东E卡兑换审核 =====
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const badge = s => '<span class="badge b-' + s + '">' + ({ active:'待复核',approved:'已通过',rejected:'已撤销',pending:'待复核' }[s] || s) + '</span>';
  // active=待复核(卡密可见,可通过对抗/驳回撤销)；approved=已通过(仅可再驳回撤销)；rejected=已撤销(无操作)
  const reviewOps = o => {
    const id = esc(o.id);
    if (o.status === 'active' || o.status === 'pending') {
      return '<button data-act="detail" data-id="' + id + '">查看卡密</button>' +
        '<button data-act="approve" data-id="' + id + '">通过保留</button>' +
        '<button class="reject" data-act="reject" data-id="' + id + '">驳回并撤销</button>';
    }
    if (o.status === 'approved') {
      return '<button class="reject" data-act="reject" data-id="' + id + '">驳回并撤销</button>';
    }
    return o.vipUntil ? '已撤销 · 原至 ' + esc(o.vipUntil) : '已撤销';
  };

  async function adm(body) {
    const secret = $('admSecret').value.trim();
    if (!secret) { $('admMsg').className = 'msg err'; $('admMsg').textContent = '请填写管理员密钥'; return null; }
    const res = await fetch('/api/redeem-admin', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ...body, secret })
    });
    return res.json().catch(() => ({}));
  }

  $('testNotify').addEventListener('click', async () => {
    $('testNotify').disabled = true;
    $('admMsg').className = 'msg'; $('admMsg').textContent = '发送中…';
    const d = await adm({ action: 'testNotify' });
    if (!d) { $('testNotify').disabled = false; return; }
    if (d.ok) { $('admMsg').className = 'msg ok'; $('admMsg').textContent = '✅ 测试通知已推送：' + (d.sent || []).join(', '); }
    else { $('admMsg').className = 'msg err'; $('admMsg').textContent = '❌ ' + (d.error || '发送失败'); }
    $('testNotify').disabled = false;
  });

  $('loadOrders').addEventListener('click', async () => {
    $('loadOrders').disabled = true;
    $('admMsg').className = 'msg'; $('admMsg').textContent = '加载中…';
    const data = await adm({ action: 'list' });
    $('loadOrders').disabled = false;
    if (!data) return;
    if (!data.orders) { $('admMsg').className = 'msg err'; $('admMsg').textContent = '❌ ' + (data.error || '加载失败'); return; }
    $('admMsg').className = 'msg ok'; $('admMsg').textContent = '共 ' + data.orders.length + ' 笔订单';
    if (!data.orders.length) { $('orderList').innerHTML = '<div class="hint">暂无订单</div>'; return; }
    let html = '<table class="tbl"><tr><th>订单号</th><th>用户</th><th>套餐</th><th>卡号</th><th>状态</th><th>提交时间</th><th>操作</th></tr>';
    for (const o of data.orders) {
      html += '<tr><td><code>' + esc(o.id) + '</code></td><td>' + esc(o.user) + '</td><td>' + o.planDays + '天</td>' +
        '<td>' + esc(o.cardMask) + '</td><td>' + badge(o.status) + '</td><td>' + new Date(o.created).toLocaleString('zh-CN') + '</td>' +
        '<td class="ops">' + reviewOps(o) + '</td></tr>';
    }
    html += '</table>';
    $('orderList').innerHTML = html;
  });

  $('orderList').addEventListener('click', async e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const act = btn.dataset.act, id = btn.dataset.id;
    if (act === 'detail') {
      btn.disabled = true;
      const d = await adm({ action: 'detail', id });
      btn.disabled = false;
      if (!d || d.error) { alert('❌ ' + (d && d.error || '失败')); return; }
      alert('卡号：' + d.cardMask + '\n卡密：' + d.cardPwd + '\n\n请复制后到京东核验，有效点「通过保留」，无效点「驳回并撤销」。');
    } else if (act === 'approve') {
      if (!confirm('确认卡密有效？将标记为已通过，会员继续保留。')) return;
      btn.disabled = true;
      const d = await adm({ action: 'approve', id });
      if (d && d.ok) { $('admMsg').className = 'msg ok'; $('admMsg').textContent = '✅ 已通过复核，会员保留：' + d.order.user; $('loadOrders').click(); }
      else { alert('❌ ' + (d && d.error || '失败')); btn.disabled = false; }
    } else if (act === 'reject') {
      if (!confirm('⚠️ 确认卡密无效？\n\n这将【撤销该用户本次兑换的会员天数】。若该订单会员已到期或被其他操作改动，则按天数扣减。此操作不可撤销，请确认卡密确实无效。')) return;
      const reason = prompt('驳回原因（可留空）：');
      if (reason === null) return;
      btn.disabled = true;
      const d = await adm({ action: 'reject', id, reason });
      if (d && d.ok) { $('admMsg').className = 'msg warn'; $('admMsg').textContent = '✅ 已驳回并撤销会员：' + id; $('loadOrders').click(); }
      else { alert('❌ ' + (d && d.error || '失败')); btn.disabled = false; }
    }
  });
</script>
</body>
</html>
