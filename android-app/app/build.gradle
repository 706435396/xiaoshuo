plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shenye.reader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shenye.reader'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // 签名：本机/CI 用仓库里的 debug.keystore 签，出的包能直接装、能覆盖升级
    signingConfigs {
        release {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 纯 WebView 套壳，零第三方依赖（体积最小、无隐私合规负担）
}
